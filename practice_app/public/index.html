// ── Import wizard ──

function startImport() {
  state.import = { step: 'pick', midiList: null, source: null, analysis: null, title: '', leftTrackIndex: null, rightTrackIndex: null, error: '', busy: false };
  state.view = 'import';
  render();
  apiGet('/api/midi/list').then(({ files }) => {
    if (state.import) { state.import.midiList = files; render(); }
  }).catch(e => { if (state.import) { state.import.error = e.message; render(); } });
}

async function pickExistingMidi(relativePath) {
  if (!relativePath || !state.import) return;
  state.import.busy = true; state.import.error = '';
  render();
  try {
    const { absolutePath, analysis } = await apiPost('/api/midi/analyze', { path: relativePath });
    applyAnalysis(absolutePath, analysis);
  } catch (e) {
    state.import.error = e.message;
  }
  state.import.busy = false;
  render();
}

async function uploadMidiFile(fileInput) {
  const file = fileInput.files && fileInput.files[0];
  if (!file || !state.import) return;
  state.import.busy = true; state.import.error = '';
  render();
  try {
    const bytes = await file.arrayBuffer();
    const res = await fetch(`/api/midi/upload?name=${encodeURIComponent(file.name)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: bytes,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '上传失败');
    applyAnalysis(data.absolutePath, data.analysis);
  } catch (e) {
    state.import.error = e.message;
  }
  state.import.busy = false;
  render();
}

function applyAnalysis(absolutePath, analysis) {
  const imp = state.import;
  imp.source = absolutePath;
  imp.analysis = analysis;
  imp.title = analysis.title;
  const right = analysis.tracks.find(t => t.roleGuess === 'right' && t.noteCount > 0);
  const left = analysis.tracks.find(t => t.roleGuess === 'left' && t.noteCount > 0);
  imp.rightTrackIndex = right ? right.index : (analysis.tracks.find(t=>t.noteCount>0)?.index ?? null);
  imp.leftTrackIndex = left ? left.index : null;
  imp.step = 'assign';
}

function updateImportField(field, value) {
  if (!state.import) return;
  state.import[field] = (field === 'leftTrackIndex' || field === 'rightTrackIndex') ? Number(value) : value;
}

async function submitCreateCourse() {
  const imp = state.import;
  if (!imp) return;
  if (imp.leftTrackIndex === imp.rightTrackIndex) {
    imp.error = '左右手不能选择同一个音轨';
    render();
    return;
  }
  imp.busy = true; imp.error = '';
  render();
  try {
    const { course } = await apiPost('/api/courses', {
      title: imp.title,
      sourceMidiPath: imp.source,
      leftTrackIndex: imp.leftTrackIndex,
      rightTrackIndex: imp.rightTrackIndex,
    });
    state.coursesLoaded = false;
    state.import = null;
    await openCourse(course.course_id);
    showToast('课程已生成：' + course.title);
  } catch (e) {
    imp.error = e.message;
    imp.busy = false;
    render();
  }
}

function renderImport() {
  const imp = state.import;
  if (!imp) return '';
  if (imp.error) {
    var errorHtml = `<div class="error-text">${escapeHtml(imp.error)}</div>`;
  }

  if (imp.step === 'pick') {
    const options = (imp.midiList || []).map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('');
    return `
      <div class="section-lbl">从曲库选择</div>
      <div class="field">
        <select onchange="pickExistingMidi(this.value)" ${imp.midiList ? '' : 'disabled'}>
          <option value="">${imp.midiList ? '请选择一个 MIDI 文件…' : '加载中…'}</option>
          ${options}
        </select>
      </div>
      <div class="section-lbl">或上传本地文件</div>
      <div class="upload-drop">
        <input type="file" accept=".mid,.midi" onchange="uploadMidiFile(this)">
        <div style="margin-top:8px;">选择一个 .mid 文件</div>
      </div>
      ${imp.busy ? '<div class="empty-hint">正在分析…</div>' : ''}
      ${errorHtml || ''}
    `;
  }

  // step === 'assign'
  const a = imp.analysis;
  const rows = a.tracks.map(t => `
    <tr>
      <td>${t.index}</td>
      <td>${escapeHtml(t.name || '(未命名)')}</td>
      <td>${t.noteCount}</td>
      <td>${t.minPitch != null ? `${t.minPitch}–${t.maxPitch}` : '—'}</td>
      <td>${t.roleGuess}</td>
    </tr>
  `).join('');
  const trackOptions = (selected) => a.tracks.map(t =>
    `<option value="${t.index}" ${t.index === selected ? 'selected' : ''}>#${t.index} ${escapeHtml(t.name || '(未命名)')} (${t.noteCount} 音)</option>`
  ).join('');

  return `
    <div class="section-lbl">曲目信息</div>
    <div class="course-card-sub" style="margin-bottom:14px;">
      ${a.bpm} BPM · ${a.timeSignature.numerator}/${a.timeSignature.denominator} 拍 · ${a.measureCount} 小节 · 约 ${Math.round(a.durationSeconds)} 秒
    </div>

    <table class="track-table">
      <thead><tr><th>轨道</th><th>名称</th><th>音符数</th><th>音域</th><th>猜测</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="field">
      <label class="field-label">课程名称</label>
      <input type="text" value="${escapeHtml(imp.title)}" oninput="updateImportField('title', this.value)">
    </div>
    <div class="field">
      <label class="field-label">右手轨道</label>
      <select onchange="updateImportField('rightTrackIndex', this.value)">${trackOptions(imp.rightTrackIndex)}</select>
    </div>
    <div class="field">
      <label class="field-label">左手轨道</label>
      <select onchange="updateImportField('leftTrackIndex', this.value)">${trackOptions(imp.leftTrackIndex)}</select>
    </div>

    ${errorHtml || ''}
    <div class="btn-row">
      <button class="btn btn-primary" ${imp.busy?'disabled':''} onclick="submitCreateCourse()">生成课程</button>
      <button class="btn btn-secondary" onclick="backToCourses()">取消</button>
    </div>
  `;
}

// ── Course detail / lessons ──

async function openCourse(courseId) {
  state.activeCourseId = courseId;
  state.activeCourse = null;
  state.manualDraft = null;
  state.view = 'course-detail';
  render();
  try {
    const { course } = await apiGet(`/api/courses/${encodeURIComponent(courseId)}?user=${encodeURIComponent(state.currentUser)}`);
    state.activeCourse = course;
  } catch (e) {
    showToast('加载课程失败：' + e.message);
  }
  render();
}

function lessonRangeLabel(l) {
  if (l.range_type === 'event') return `事件 ${l.start_event}–${l.end_event}`;
  return `第 ${l.start_measure + 1}–${l.end_measure} 小节`;
}

function renderCourseDetail() {
  const course = state.activeCourse;
  if (!course) return `<div class="empty-hint">加载中…</div>`;

  const stages = ['A', 'B', 'C', 'manual'];
  const sections = stages.map(stage => {
    const lessons = course.lessons.filter(l => l.stage === stage);
    if (!lessons.length) return '';
    const rows = lessons.map(l => {
      const requiredRuns = requiredRunsForPracticeLesson(l);
      const successfulRuns = successfulRunsForPracticeLesson(l);
      return `
        <div class="lesson-row ${l.unlocked ? '' : 'locked'}">
          <div class="lesson-row-top">
            <div>
              <div class="lesson-title">${escapeHtml(l.title)}</div>
              <div class="lesson-meta">${lessonRangeLabel(l)} · 速度 ${Math.round(l.speed*100)}% · ${l.unlocked ? (l.completed ? '已完成' : '可练习') : '未解锁'} · 达标 ${successfulRuns}/${requiredRuns} 次${l.best_score != null ? ` · 最高 ${l.best_score} 分` : ''}</div>
            </div>
            <div class="lesson-badges">
              <span class="lesson-badge badge-hand-${l.hand_mode}">${HAND_LABEL[l.hand_mode]}</span>
              ${l.completed ? '<span class="lesson-badge badge-done">✓</span>' : ''}
            </div>
          </div>
          <div class="lesson-actions">
            <button class="btn btn-primary" ${l.unlocked ? '' : 'disabled'} onclick="openPracticeSession('${course.course_id}','${l.lesson_id}')">🎯 评分练习</button>
            <button class="btn btn-secondary" ${l.unlocked ? '' : 'disabled'} onclick="startPractice('${course.course_id}','${l.lesson_id}')">在 Neothesia 中练习</button>
          </div>
        </div>`;
    }).join('');
    return `<div class="stage-header">${STAGE_LABEL[stage]}</div>${rows}`;
  }).join('');

  return `
    <div class="course-card-sub" style="margin-bottom:10px;">
      ${course.bpm} BPM · ${course.measure_count} 小节 · ${course.lessons.filter(l=>l.completed).length}/${course.lessons.length} 关卡完成
    </div>
    <div class="course-progress-track" style="margin-bottom:16px;"><div class="course-progress-fill" style="width:${courseProgress(course)}%"></div></div>
    ${sections}
    ${renderManualLessonForm(course)}
  `;
}

// ── Manual lesson creation (MVP 功能四) ──

function ensureManualDraft() {
  if (!state.manualDraft) {
    state.manualDraft = { open: false, title: '', hand_mode: 'both', range_type: 'measure', start: 0, end: 2, speed: 0.5, busy: false, error: '' };
  }
  return state.manualDraft;
}

function toggleManualForm() {
  const d = ensureManualDraft();
  d.open = !d.open;
  render();
}

function updateManualField(field, value) {
  const d = ensureManualDraft();
  d[field] = (field === 'start' || field === 'end' || field === 'speed') ? Number(value) : value;
}

async function submitManualLesson(courseId) {
  const d = ensureManualDraft();
  if (d.end <= d.start) { d.error = '结束位置必须大于起始位置'; render(); return; }
  d.busy = true; d.error = '';
  render();
  try {
    const spec = {
      title: d.title || undefined,
      hand_mode: d.hand_mode,
      range_type: d.range_type,
      speed: d.speed,
    };
    if (d.range_type === 'event') { spec.start_event = d.start; spec.end_event = d.end; }
    else { spec.start_measure = d.start; spec.end_measure = d.end; }
    await apiPost(`/api/courses/${encodeURIComponent(courseId)}/lessons`, spec);
    const { course } = await apiGet(`/api/courses/${encodeURIComponent(courseId)}?user=${encodeURIComponent(state.currentUser)}`);
    state.activeCourse = course;
    state.manualDraft = null;
    showToast('已添加手动关卡');
  } catch (e) {
    d.error = e.message;
    d.busy = false;
    render();
  }
}

function renderManualLessonForm(course) {
  const d = ensureManualDraft();
  if (!d.open) {
    return `<div class="btn-row" style="margin-top:18px;"><button class="btn btn-secondary" onclick="toggleManualForm()">＋ 手动添加关卡</button></div>`;
  }
  const unitLabel = d.range_type === 'event' ? '事件序号' : '小节序号（从 0 开始）';
  return `
    <div class="stage-header">手动添加关卡</div>
    <div class="field">
      <label class="field-label">关卡名称</label>
      <input type="text" value="${escapeHtml(d.title)}" oninput="updateManualField('title', this.value)">
    </div>
    <div class="field">
      <label class="field-label">范围类型</label>
      <select onchange="updateManualField('range_type', this.value); render();">
        <option value="measure" ${d.range_type==='measure'?'selected':''}>按小节</option>
        <option value="event" ${d.range_type==='event'?'selected':''}>按音符事件</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">起始${unitLabel}</label>
      <input type="number" min="0" value="${d.start}" oninput="updateManualField('start', this.value)">
    </div>
    <div class="field">
      <label class="field-label">结束${unitLabel}（不含）</label>
      <input type="number" min="1" value="${d.end}" oninput="updateManualField('end', this.value)">
    </div>
    <div class="field">
      <label class="field-label">手位</label>
      <select onchange="updateManualField('hand_mode', this.value)">
        <option value="both" ${d.hand_mode==='both'?'selected':''}>双手</option>
        <option value="right" ${d.hand_mode==='right'?'selected':''}>右手</option>
        <option value="left" ${d.hand_mode==='left'?'selected':''}>左手</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">初始速度 (0.1–1.0)</label>
      <input type="number" min="0.1" max="1" step="0.05" value="${d.speed}" oninput="updateManualField('speed', this.value)">
    </div>
    ${d.error ? `<div class="error-text">${escapeHtml(d.error)}</div>` : ''}
    <div class="btn-row">
      <button class="btn btn-primary" ${d.busy?'disabled':''} onclick="submitManualLesson('${course.course_id}')">保存关卡</button>
      <button class="btn btn-secondary" onclick="toggleManualForm()">取消</button>
    </div>
  `;
}

async function startPractice(courseId, lessonId) {
  try {
    showToast('正在导出并启动 Neothesia…');
    await apiPost(`/api/courses/${encodeURIComponent(courseId)}/lessons/${encodeURIComponent(lessonId)}/practice`, {});

// ═══════════════════════════════════════
//  PRACTICE SESSION (Web MIDI 实时评分，第七节 模式一：等待模式)
// ═══════════════════════════════════════

function midiNoteName(n) {
  return `${PITCH_NAMES[((n % 12) + 12) % 12]}${Math.floor(n / 12) - 1}`;
}

const FINGER_NAMES = { 1: '拇指', 2: '食指', 3: '中指', 4: '无名指', 5: '小指' };
const REQUIRED_RUNS_BY_STAGE = { A: 2, B: 3, C: 4, manual: 3 };

function renderPracticeFingerGuide(p, event) {
  const cards = event.notes.map(note => {
    const hand = HAND_LABEL[note.hand] || note.hand || '本手';
    const keyboardKey = p.inputMode === 'computer-keyboard'
      ? COMPUTER_KEYBOARD_LAYOUT.find(key => p.keyboardBaseNote + key.semitone === note.note)
      : null;
    const fingerText = note.finger
      ? `第 ${note.finger} 指（${FINGER_NAMES[note.finger]}）`
      : '按这个琴键';
    const keyText = keyboardKey
      ? `电脑键盘：<kbd>${keyboardKey.label}</kbd>`
      : `钢琴键：${midiNoteName(note.note)}`;
    return `
      <div class="practice-finger-card ${note.hand === 'left' ? 'left' : 'right'}">
        <div class="practice-finger-top"><span class="practice-finger-hand">${escapeHtml(hand)}</span><span class="practice-finger-note">${midiNoteName(note.note)}</span></div>
        <div class="practice-finger-detail">${fingerText}</div>
        <div class="practice-finger-key">${keyText}</div>
      </div>`;
  }).join('');
  return `
    <section class="practice-finger-guide" aria-label="当前音符的手指和键位提示">
      <div class="practice-finger-title">当前音的手指与键位</div>
      <div class="practice-finger-list">${cards}</div>
    </section>`;
}

function requiredRunsForPracticeLesson(lesson) {
  const configured = Number(lesson?.pass_condition?.required_runs);
  if (Number.isInteger(configured) && configured > 0) return configured;
  return Number(lesson?.required_runs) || REQUIRED_RUNS_BY_STAGE[lesson?.stage] || 3;
}

function successfulRunsForPracticeLesson(lesson) {
  const stored = Math.max(0, Number(lesson?.successful_runs) || 0);
  const inferred = (lesson?.sessions || []).filter(session => session.runPassed === true || Number(session.starCount) > 0).length;
  const successfulRuns = Math.max(stored, inferred);
  return lesson?.completed ? Math.max(successfulRuns, requiredRunsForPracticeLesson(lesson)) : successfulRuns;
}

function practiceRunProgress(p) {
  const lesson = p?.finished?.lesson || p?.lesson;
  const requiredRuns = Number(p?.finished?.requiredRuns) || requiredRunsForPracticeLesson(lesson);
  const successfulRuns = Number(p?.finished?.successfulRuns);
  return {
    requiredRuns,
    successfulRuns: Number.isFinite(successfulRuns) ? successfulRuns : successfulRunsForPracticeLesson(lesson),
  };
}

async function openPracticeSession(courseId, lessonId, options = {}) {
  if (state.practice) {
    clearPracticeCountdown(state.practice);
    disconnectPracticeMidi();
  }
  const inputMode = options.inputMode === 'computer-keyboard' ? 'computer-keyboard' : 'midi';
  state.settings = { ...state.settings, lastCourseId: courseId, lastLessonId: lessonId };
  apiPost('/api/settings', { lastCourseId: courseId, lastLessonId: lessonId }).catch(() => {});
  state.practice = {
    courseId, lessonId, lesson: null, events: null, sheet: null,
    midiStatus: 'idle', midiInputs: [], midiAccess: null, midiStateTimer: null, inputMode,
    keyboardBaseNote: 60, keyboardPressedCodes: new Set(),
    session: null, result: null, finished: null, finishing: false, loadError: '',
    countdownTimer: null, countdownInterval: null, countdownSeconds: null,
  };
  state.view = 'practice-session';
  render();
  try {
    const [{ course }, practiceData] = await Promise.all([
      apiGet(`/api/courses/${encodeURIComponent(courseId)}?user=${encodeURIComponent(state.currentUser)}`),
      apiGet(`/api/courses/${encodeURIComponent(courseId)}/lessons/${encodeURIComponent(lessonId)}/practice-data`),
    ]);
    if (!state.practice || state.practice.lessonId !== lessonId) return; // navigated away while loading
    state.practice.lesson = course.lessons.find(l => l.lesson_id === lessonId);
    state.practice.events = practiceData.events;
    state.practice.sheet = practiceData.sheet;
    state.practice.sheet.eventIndexToLocal = new Map(practiceData.sheet.targetEventIndexes.map((index, localIndex) => [index, localIndex]));
    state.practice.session = PracticeScoring.createWaitModeSession(practiceData.events);
    state.practice.result = state.practice.session.getResult();
    render();
    if (state.practice.inputMode === 'computer-keyboard') {
      state.practice.keyboardBaseNote = suggestedKeyboardBaseNote(practiceData.events);
      render();
    } else {
      connectMidiForPractice();
    }
  } catch (e) {
    if (state.practice) state.practice.loadError = e.message;
    render();
  }
}

function clearPracticeCountdown(p = state.practice) {
  if (!p) return;
  clearTimeout(p.countdownTimer);
  clearInterval(p.countdownInterval);
  p.countdownTimer = null;
  p.countdownInterval = null;
  p.countdownSeconds = null;
}

function disconnectPracticeMidi() {
  const p = state.practice;
  if (!p) return;
  clearTimeout(p.midiStateTimer);
  p.midiStateTimer = null;
  if (p.midiAccess) p.midiAccess.onstatechange = null;
  for (const input of p.midiInputs || []) input.onmidimessage = null;
  p.midiInputs = [];
  p.midiAccess = null;
}

function exitPracticeSession() {
  const courseId = state.practice?.courseId || state.activeCourseId;
  clearPracticeCountdown();
  disconnectPracticeMidi();
  state.practice = null;
  state.view = 'course-detail';
  render();
  if (courseId) openCourse(courseId);
}

async function connectMidiForPractice() {
  const p = state.practice;
  if (!p) return;
  disconnectPracticeMidi();
  p.inputMode = 'midi';
  p.keyboardPressedCodes.clear();
  if (!navigator.requestMIDIAccess) {
    p.midiStatus = 'unsupported';
    render();
    return;
  }
  p.midiStatus = 'requesting';
  render();
  try {
    const access = await navigator.requestMIDIAccess({ sysex: false });
    const inputs = [...access.inputs.values()];
    if (!state.practice || state.practice !== p) return;
    p.midiAccess = access;
    access.onstatechange = event => schedulePracticeMidiRefresh(p, access, event);
    if (!inputs.length) {
      p.midiStatus = 'no-devices';
      render();
      return;
    }
    bindPracticeMidiInputs(p, inputs);
    render();
  } catch (e) {
    if (state.practice === p) { p.midiStatus = 'denied'; p.loadError = e.message; render(); }
  }
}

function bindPracticeMidiInputs(p, inputs) {
  const nextInputs = inputs.filter(input => input.state !== 'disconnected');
  for (const input of p.midiInputs || []) {
    if (!nextInputs.includes(input)) input.onmidimessage = null;
  }
  p.midiInputs = nextInputs;
  for (const input of nextInputs) input.onmidimessage = handlePracticeMidiMessage;
  p.midiStatus = nextInputs.length ? 'connected' : 'no-devices';
}

function schedulePracticeMidiRefresh(p, access, event) {
  if (!state.practice || state.practice !== p || p.midiAccess !== access) return;
  clearTimeout(p.midiStateTimer);
  const explicitlyDisconnected = event?.port?.state === 'disconnected';
  p.midiStateTimer = setTimeout(() => {
    if (!state.practice || state.practice !== p || p.midiAccess !== access) return;
    const inputs = [...access.inputs.values()];
    if (inputs.length) {
      bindPracticeMidiInputs(p, inputs);
    } else if (explicitlyDisconnected) {
      bindPracticeMidiInputs(p, []);
    } else if (p.midiInputs.length) {
      // Chrome may emit a connection-state update when a port first opens.
      // Keep the proven input binding instead of treating that short gap as a disconnect.
      p.midiStatus = 'connected';
    } else {
      p.midiStatus = 'no-devices';
    }
    render();
  }, 350);
}

function applyPracticeInput(p, pitch, isNoteOn) {
  if (!p || !p.session || p.finished || p.finishing) return;
  if (isNoteOn) { onPracticeActivity(); p.session.noteOn(pitch); }
  else p.session.noteOff(pitch);
  p.result = p.session.getResult();
  if (p.result.isComplete) finishPracticeSession();
  else render();
}

function handlePracticeMidiMessage(e) {
  const p = state.practice;
  if (!p || p.inputMode !== 'midi') return;
  const [status, data1, data2] = e.data;
  const command = status & 0xf0;
  if (command === 0x90 && data2 > 0) applyPracticeInput(p, data1, true);
  else if (command === 0x80 || (command === 0x90 && data2 === 0)) applyPracticeInput(p, data1, false);
  else return;
}

async function finishPracticeSession() {
  const p = state.practice;
  if (!p || p.finishing) return;
  p.finishing = true;
  const result = p.result;
  try {
    const { lesson, runPassed, completed, justCompleted, nextLesson, starCount, successfulRuns, requiredRuns } = await apiPost(
      `/api/courses/${encodeURIComponent(p.courseId)}/lessons/${encodeURIComponent(p.lessonId)}/sessions`,
      { ...result, user: state.currentUser },
    );
    p.lesson = lesson;
    p.finished = { runPassed, completed, justCompleted, nextLesson, lesson, starCount, successfulRuns, requiredRuns };
    startPracticeCountdown(p);
  } catch (e) {
    p.finished = { runPassed: false, completed: false, error: e.message };
  }
  render();
}

function retryPracticeSession() {
  const p = state.practice;
  if (!p || !p.events) return;
  clearPracticeCountdown(p);
  p.session = PracticeScoring.createWaitModeSession(p.events);
  p.result = p.session.getResult();
  p.finished = null;
  p.finishing = false;
  p.keyboardPressedCodes.clear();
  render();
}

function startPracticeCountdown(p) {
  clearPracticeCountdown(p);
  const deadline = Date.now() + 3000;
  p.countdownSeconds = 3;
  p.countdownInterval = setInterval(() => {
    if (state.practice !== p) return clearPracticeCountdown(p);
    const nextSeconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if (p.countdownSeconds !== nextSeconds) {
      p.countdownSeconds = nextSeconds;
      render();
    }
  }, 120);
  p.countdownTimer = setTimeout(() => {
    if (state.practice !== p) return;
    clearPracticeCountdown(p);
    if (p.finished?.runPassed && p.finished?.completed) {
      if (p.finished.nextLesson) goToNextPracticeLesson();
      else exitPracticeSession();
    } else {
      retryPracticeSession();
    }
  }, 3000);
}

function goToNextPracticeLesson() {
  const p = state.practice;
  const nextLesson = p?.finished?.nextLesson;
  if (!p || !nextLesson) return;
  clearPracticeCountdown(p);
  openPracticeSession(p.courseId, nextLesson.lesson_id, { inputMode: p.inputMode });
}

const COMPUTER_KEYBOARD_LAYOUT = [
  ['KeyA', 'A', 0], ['KeyW', 'W', 1], ['KeyS', 'S', 2], ['KeyE', 'E', 3],
  ['KeyD', 'D', 4], ['KeyF', 'F', 5], ['KeyT', 'T', 6], ['KeyG', 'G', 7],
  ['KeyY', 'Y', 8], ['KeyH', 'H', 9], ['KeyU', 'U', 10], ['KeyJ', 'J', 11],
  ['KeyK', 'K', 12], ['KeyO', 'O', 13], ['KeyL', 'L', 14], ['KeyP', 'P', 15],
  ['Semicolon', ';', 16], ['Quote', "'", 17],
].map(([code, label, semitone]) => ({ code, label, semitone }));
const COMPUTER_KEYBOARD_BY_CODE = new Map(COMPUTER_KEYBOARD_LAYOUT.map(key => [key.code, key]));

function suggestedKeyboardBaseNote(events) {
  const firstEvent = events?.find(event => event.notes?.length);
  const lowest = firstEvent ? Math.min(...firstEvent.notes.map(note => note.note)) : 60;
  return Math.max(24, Math.min(96, Math.floor(lowest / 12) * 12));
}

function releaseComputerKeyboardNotes(p) {
  if (!p?.keyboardPressedCodes?.size) return;
  for (const code of p.keyboardPressedCodes) {
    const key = COMPUTER_KEYBOARD_BY_CODE.get(code);
    if (key) p.session?.noteOff(p.keyboardBaseNote + key.semitone);
  }
  p.keyboardPressedCodes.clear();
}

function useComputerKeyboardForPractice() {
  const p = state.practice;
  if (!p?.events || p.finished) return;
  releaseComputerKeyboardNotes(p);
  p.inputMode = 'computer-keyboard';
  p.keyboardBaseNote = suggestedKeyboardBaseNote(p.events);
  p.loadError = '';
  render();
}

function shiftComputerKeyboardOctave(direction) {
  const p = state.practice;
  if (!p || p.inputMode !== 'computer-keyboard') return;
  releaseComputerKeyboardNotes(p);
  p.keyboardBaseNote = Math.max(24, Math.min(96, p.keyboardBaseNote + direction * 12));
  render();
}

function handleComputerKeyboardEvent(event) {
  const p = state.practice;
  if (!p || p.inputMode !== 'computer-keyboard' || !p.session || p.finished) return;
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const activeTag = document.activeElement?.tagName;
  if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return;
  const key = COMPUTER_KEYBOARD_BY_CODE.get(event.code);
  if (!key) return;

  event.preventDefault();
  if (event.type === 'keydown') {
    if (event.repeat || p.keyboardPressedCodes.has(event.code)) return;
    p.keyboardPressedCodes.add(event.code);
    applyPracticeInput(p, p.keyboardBaseNote + key.semitone, true);
  } else {
    if (!p.keyboardPressedCodes.has(event.code)) return;
    p.keyboardPressedCodes.delete(event.code);
    applyPracticeInput(p, p.keyboardBaseNote + key.semitone, false);
  }
}

function renderComputerKeyboard(p, event) {
  const targetPitches = new Set(event.notes.map(note => note.note));
  const lowest = p.keyboardBaseNote;
  const highest = lowest + 17;
  const hasOutOfRangeTarget = [...targetPitches].some(pitch => pitch < lowest || pitch > highest);
  const keys = COMPUTER_KEYBOARD_LAYOUT.map(key => {
    const pitch = lowest + key.semitone;
    const isSharp = pitch % 12 === 1 || pitch % 12 === 3 || pitch % 12 === 6 || pitch % 12 === 8 || pitch % 12 === 10;
    return `<div class="pc-key${isSharp ? ' sharp' : ''}${targetPitches.has(pitch) ? ' target' : ''}"><span class="pc-key-code">${key.label}</span><span class="pc-key-note">${midiNoteName(pitch)}</span></div>`;
  }).join('');
  return `
    <div class="pc-keyboard">
      <div class="pc-keyboard-head"><strong>电脑键盘输入</strong><span>A = ${midiNoteName(lowest)}</span></div>
      <div class="pc-key-grid">${keys}</div>
      <div class="pc-keyboard-controls">
        <button class="btn btn-secondary" onclick="shiftComputerKeyboardOctave(-1)">降八度</button>
        <button class="btn btn-secondary" onclick="shiftComputerKeyboardOctave(1)">升八度</button>
      </div>
      ${hasOutOfRangeTarget ? '<div class="pc-keyboard-warning">当前目标不在这组键位里，请先切换八度。</div>' : ''}
    </div>`;
}

const MIDI_STATUS_INFO = {
  idle: { icon: '⏳', text: '准备连接电子钢琴…' },
  requesting: { icon: '🔌', text: '请求 MIDI 权限中，请在浏览器弹窗里点击允许…' },
  unsupported: { icon: '🚫', text: 'Web MIDI 目前只有 Chrome / Edge 桌面浏览器支持，换一个浏览器打开，或改用下面「在 Neothesia 中练习」（不计分）。' },
  'no-devices': { icon: '🎹', text: '浏览器暂未枚举到 MIDI 输入。确认电子钢琴已开机并允许本网站使用 MIDI 后，点击重试连接。' },
  denied: { icon: '❌', text: '没有获得 MIDI 权限，或连接失败。' },
};

function renderPracticeSession() {
  const p = state.practice;
  if (!p) return '';
  if (p.loadError && !p.events) {
    return `<div class="empty-hint">加载失败：${escapeHtml(p.loadError)}</div>`;
  }
  if (!p.events) {
    return `<div class="empty-hint">加载中…</div>`;
  }

  if (p.finished) {
    const r = p.result;
    const starCount = Math.max(0, Math.min(3, Number(p.finished.starCount) || 0));
    const bestStarCount = Math.max(0, Math.min(3, Number(p.finished.lesson?.best_star_count) || 0));
    const nextLesson = p.finished.nextLesson;
    const runProgress = practiceRunProgress(p);
    const runLabel = `${runProgress.successfulRuns} / ${runProgress.requiredRuns} 次达标`;
    const shouldAdvance = p.finished.runPassed && p.finished.completed;
    const transitionLabel = shouldAdvance
      ? (nextLesson ? '进入下一关' : '返回课程')
      : '再来一次';
    const resultMessage = p.finished.error
      ? `保存成绩失败：${p.finished.error}`
      : p.finished.runPassed
        ? (p.finished.completed
          ? (nextLesson ? '✓ 本关累计达标，下一关已解锁' : '✓ 本课程的全部关卡已完成')
          : `✓ 本次达标，还需 ${Math.max(0, runProgress.requiredRuns - runProgress.successfulRuns)} 次`)
        : '本次未达标，不计入累计次数';
    const handsRows = Object.entries(r.hands || {}).map(([hand, h]) =>
      `<div>${Math.round(h.accuracy * 100)}%<span>${HAND_LABEL[hand] || hand}准确率</span></div>`
    ).join('');
    return `
      <div class="practice-wrap">
        <div class="result-card">
          <div class="result-score">${r.score} 分</div>
          <div class="result-stars" aria-label="本次 ${starCount} 星">${'★'.repeat(starCount)}${'☆'.repeat(3 - starCount)}</div>
          <div class="result-star-label">本次获得 ${starCount} 星</div>
          <div class="result-pass ${p.finished.runPassed ? 'pass' : 'fail'}">${escapeHtml(resultMessage)}</div>
          <div class="result-next">本关累计：${runLabel}</div>
          ${nextLesson ? `<div class="result-next">下一关：${escapeHtml(nextLesson.title)}</div>` : ''}
          ${p.finished.lesson ? `<div class="result-best">历史最佳 ${'★'.repeat(bestStarCount)}${'☆'.repeat(3 - bestStarCount)}</div>` : ''}
          <div class="result-grid">
            <div>${r.correctEvents} / ${r.totalEvents}<span>正确事件</span></div>
            <div>${r.maxCombo}<span>最大连续正确</span></div>
            <div>${r.extraNotes}<span>多弹/错音次数</span></div>
            <div>${Math.round(r.durationMs/1000)} 秒<span>用时</span></div>
            ${handsRows}
          </div>
          <div class="btn-row" style="justify-content:center;">
            ${shouldAdvance && nextLesson ? '<button class="btn btn-primary" onclick="goToNextPracticeLesson()">立即进入下一关</button>' : ''}
            ${shouldAdvance && !nextLesson ? '<button class="btn btn-primary" onclick="exitPracticeSession()">返回课程</button>' : ''}
            ${!shouldAdvance ? '<button class="btn btn-primary" onclick="retryPracticeSession()">立即再来一次</button>' : ''}
            <button class="btn btn-secondary" onclick="exitPracticeSession()">返回课程</button>
          </div>
          ${p.countdownSeconds != null ? `<div class="result-countdown">${p.countdownSeconds} 秒后自动${transitionLabel}</div>` : ''}
        </div>
        ${renderPracticeScorePanel(p)}
      </div>
    `;
  }

  if (p.inputMode !== 'computer-keyboard' && p.midiStatus !== 'connected') {
    const info = MIDI_STATUS_INFO[p.midiStatus] || MIDI_STATUS_INFO.idle;
    const retryable = p.midiStatus === 'no-devices' || p.midiStatus === 'denied';
    return `
      <div class="practice-wrap">
        <div class="midi-status-card" role="status">
          <div class="midi-status-icon">${info.icon}</div>
          <div>${escapeHtml(info.text)}</div>
          <div class="btn-row" style="justify-content:center;">
            ${retryable ? '<button class="btn btn-primary" onclick="connectMidiForPractice()">重试连接</button>' : ''}
            <button class="btn btn-primary" onclick="useComputerKeyboardForPractice()">使用电脑键盘评分</button>
            <button class="btn btn-secondary" onclick="startPractice('${p.courseId}','${p.lessonId}'); exitPracticeSession();">改用 Neothesia（不计分）</button>
          </div>
        </div>
        ${renderPracticeScorePanel(p)}
      </div>
    `;
  }

  const event = p.session.getCurrentEvent();
  const r = p.result;
  const dots = p.events.map((e, i) => {
    let cls = 'practice-dot';
    if (i < p.session.getEventIndex()) cls += r.mistakeEventIndexes.includes(i) ? ' done-mess' : ' done-clean';
    else if (i === p.session.getEventIndex()) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');
  const runProgress = practiceRunProgress(p);

  return `
    <div class="practice-wrap">
      ${state.practiceTimeWarning ? `
        <div class="practice-overtime-banner">
          ⏰ 已连续练习超过 20 分钟，建议今天先休息，明天再来效果更好！
        </div>` : ''}
      <div class="practice-lesson-meta">
        <div class="practice-progress">第 ${p.session.getEventIndex() + 1} / ${p.events.length} 个音符事件</div>
        <div class="practice-stage">${dots}</div>
        <div class="practice-run-progress">本关累计达标 <strong>${runProgress.successfulRuns} / ${runProgress.requiredRuns}</strong> 次</div>
        ${state.practiceTimer.active && state.practiceTimer.startTime
          ? `<div class="practice-timer-live">⏱ ${escapeHtml(state.currentUser)} · ${formatPracticeTime(Math.floor((Date.now() - state.practiceTimer.startTime) / 1000))}</div>`
          : ''}
      </div>
      <div class="practice-score-layout">
        <aside class="practice-finger-float">
          ${renderPracticeFingerGuide(p, event)}
        </aside>
        <div class="practice-score-main">
          ${renderPracticeScorePanel(p)}
        </div>
      </div>
      ${p.inputMode === 'computer-keyboard' ? renderComputerKeyboard(p, event) : `<div class="practice-input-note">已连接 MIDI：<strong>${escapeHtml(p.midiInputs.map(input => input.name || input.id || '未命名输入').join('、'))}</strong><br>直接开始弹奏。</div>`}
      <div class="practice-stats">
        <div class="practice-stat"><div class="practice-stat-val">${r.currentCombo}</div><div class="practice-stat-lbl">连击</div></div>
        <div class="practice-stat"><div class="practice-stat-val">${r.correctEvents}</div><div class="practice-stat-lbl">正确</div></div>
        <div class="practice-stat"><div class="practice-stat-val">${r.extraNotes}</div><div class="practice-stat-lbl">多弹/错音</div></div>
      </div>
      <div class="btn-row"><button class="btn btn-secondary" onclick="exitPracticeSession()">退出练习</button></div>
    </div>
  `;
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
loadState();
render();
loadCourses();
loadStaffScores();

window.addEventListener('resize', () => {
  clearTimeout(scoreResizeTimer);
  scoreResizeTimer = setTimeout(() => {
    if (state.view === 'detail') renderActiveScore();
    else if (state.view === 'practice-session') renderPracticeScore(state.practice);
  }, 120);
});
window.addEventListener('keydown', handleComputerKeyboardEvent);
window.addEventListener('keyup', handleComputerKeyboardEvent);
</script>
</body>
</html>
