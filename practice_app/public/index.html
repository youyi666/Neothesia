<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6c3fc5">
<title>🎹 练琴</title>
<style>
:root {
  --bg: #f0ecfa;
  --card: #fff;
  --primary: #6c3fc5;
  --primary-light: #ede8f8;
  --text: #1a1a2e;
  --muted: #888;
  --border: #e4dff5;
  --tab-h: 60px;
  --hdr-h: 52px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body { font-family:"PingFang SC","Helvetica Neue",sans-serif; background:var(--bg); color:var(--text); }

/* ── Layout ── */
#root { display:flex; flex-direction:column; height:100%; }
.hdr { height:var(--hdr-h); background:var(--primary); color:#fff; display:flex; align-items:center; padding:0 16px; flex-shrink:0; }
.hdr-title { font-size:17px; font-weight:600; flex:1; }
.hdr-back { font-size:22px; margin-right:10px; cursor:pointer; }
.content { flex:1; overflow-y:auto; padding:14px 12px 8px; overflow-anchor:none; }
.tab-bar { height:var(--tab-h); background:#fff; border-top:1px solid var(--border); display:flex; flex-shrink:0; }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--muted); cursor:pointer; transition:color .2s; }
.tab.active { color:var(--primary); }
.tab .icon { font-size:22px; }

/* ── Song list ── */
.song-card { background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.song-info { flex:1; }
.song-title { font-size:16px; font-weight:600; margin-bottom:2px; }
.song-sub { font-size:12px; color:var(--muted); }
.song-badges { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.level-badge { font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; }
.lv1 { background:#ddeeff; color:#1a6fa8; }
.lv2 { background:#d5f5e3; color:#1a7a43; }
.lv3 { background:#fde8cc; color:#a05a00; }
.lv4 { background:#fdd5d5; color:#a01a1a; }
.lv5 { background:#fff3cc; color:#8a6200; }
.prof-dot { width:10px; height:10px; border-radius:50%; }

/* ── Proficiency colors ── */
.p0 { background:#ddd; }
.p1 { background:#f39c12; }
.p2 { background:#3498db; }
.p3 { background:#2ecc71; }

/* ── Fullscreen sheet view ── */
.sf-wrap {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#fafafa; z-index:200;
  display:flex; flex-direction:column;
}
.sf-hdr {
  height:52px; background:var(--primary); color:#fff;
  display:flex; align-items:center; padding:0 16px;
  flex-shrink:0; gap:12px;
  box-shadow:0 2px 8px rgba(108,63,197,.25);
}
.sf-hdr-back {
  font-size:28px; cursor:pointer; flex-shrink:0;
  opacity:.9; line-height:1; padding-right:4px;
}
.sf-hdr-title { flex:1; font-size:16px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sf-hdr-sub { font-size:11px; opacity:.7; flex-shrink:0; white-space:nowrap; }
.sf-prof {
  display:flex; gap:6px; padding:8px 12px;
  background:#fff; flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.sf-prof-btn {
  flex:1; text-align:center; padding:5px 3px;
  border-radius:8px; cursor:pointer;
  border:2px solid transparent; transition:all .15s;
  display:flex; flex-direction:column; align-items:center; gap:1px;
}
.sf-prof-btn.sel { border-color:var(--primary); font-weight:700; }
.pf-icon { font-size:14px; line-height:1.2; }
.pf-label { font-size:10px; line-height:1.2; white-space:nowrap; }
.pb0{background:#f5f5f5;color:#888}
.pb1{background:#fef5e4;color:#a06800}
.pb2{background:#eaf4fd;color:#1a5a8a}
.pb3{background:#eafaf1;color:#1a6b3a}
.sf-body { flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; overflow-anchor:none; }
.sheet-section { margin-bottom:20px; }
.sheet-label {
  font-size:11px; font-weight:700; color:var(--primary);
  letter-spacing:1.5px; text-transform:uppercase;
  margin-bottom:8px; padding-bottom:4px;
  border-bottom:2px solid var(--primary-light);
}
.sheet-row {
  font-family:"Courier New",Courier,monospace;
  font-size:22px; line-height:2; letter-spacing:5px;
  white-space:nowrap; overflow-x:auto; display:block;
  -webkit-overflow-scrolling:touch; padding-bottom:2px;
}
/* ── 双手对齐谱（grid 按节拍列对齐） ── */
.duo-block { margin-bottom:22px; }
.duo-scroller { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.duo-grid {
  display:grid;
  grid-template-columns:20px repeat(var(--cols),1fr);
  width:100%;
}
.duo-grid-lbl {
  display:flex; align-items:center;
  font-size:10px; font-weight:700; font-family:sans-serif; letter-spacing:0;
}
.duo-grid-lbl.r { color:var(--primary); }
.duo-grid-lbl.l { color:var(--muted); }
.duo-cell-r {
  font-family:"Courier New",Courier,monospace;
  font-size:20px; text-align:center; line-height:2.2;
}
.duo-cell-r span { display:inline-block; position:relative; }
.duo-cell-r span.n1{color:#e74c3c}
.duo-cell-r span.n2{color:#e07b39}
.duo-cell-r span.n3{color:#27ae60}
.duo-cell-r span.n4{color:#2475a8}
.duo-cell-r span.n5{color:#7c5cbf}
.duo-cell-r span.n6{color:#16a085}
.duo-cell-r span.n7{color:#555}
.duo-cell-r span.rest{color:#ccc;font-size:.8em}
.duo-cell-l {
  font-family:"Courier New",Courier,monospace;
  font-size:11px; color:var(--muted); text-align:center;
  border-top:1px dashed var(--border);
  line-height:2; padding:1px 0 3px;
}
.duo-cell-l.ld { color:#ddd; }
/* ── 横屏：头部 + 熟练度栏压缩成一行 ── */
@media (orientation:landscape) {
  .sf-hdr { height:38px; }
  .sf-prof { padding:3px 10px; gap:8px; }
  .sf-prof-btn { flex-direction:row; gap:5px; padding:3px 10px; flex:none; }
  .pf-icon { font-size:13px; }
  .pf-label { font-size:11px; }
  .sheet-row { font-size:26px; letter-spacing:6px; }
  .duo-cell-r { font-size:24px; }
  .duo-cell-l { font-size:13px; }
}
.sheet-row span { display:inline-block; position:relative; }
.sheet-row span.n1{color:#e74c3c}
.sheet-row span.n2{color:#e07b39}
.sheet-row span.n3{color:#27ae60}
.sheet-row span.n4{color:#2475a8}
.sheet-row span.n5{color:#7c5cbf}
.sheet-row span.n6{color:#16a085}
.sheet-row span.n7{color:#555}
.sheet-row span.rest{color:#ccc;font-size:.8em}
/* 八度点：^ = 上方高八度，_ = 下方低八度 */
.oct-hi::after { content:'·'; position:absolute; top:-0.5em; left:50%; transform:translateX(-50%); font-size:.7em; font-weight:900; line-height:1; }
.oct-lo::after { content:'·'; position:absolute; bottom:-0.4em; left:50%; transform:translateX(-50%); font-size:.7em; font-weight:900; line-height:1; }

/* ── MIDI 五线谱 ── */
.score-guide {
  display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px;
}
.score-key {
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 9px; border-radius:999px; background:#fff;
  border:1px solid var(--border); color:#555; font-size:11px;
}
.score-key strong { color:var(--text); }
.score-key .clef-mini {
  font-family:"Segoe UI Symbol","Noto Music",serif;
  color:var(--primary); font-size:20px; line-height:12px;
}
.score-card {
  background:#fff; border:1px solid var(--border); border-radius:14px;
  overflow:hidden; box-shadow:0 2px 10px rgba(42,24,80,.06);
}
.score-toolbar {
  min-height:42px; padding:7px 10px 7px 12px;
  display:flex; align-items:center; gap:10px;
  background:#f7f4fc; border-bottom:1px solid var(--border);
}
.score-facts { flex:1; min-width:0; font-size:11px; color:#655d73; line-height:1.4; }
.note-toggle {
  flex-shrink:0; border:1px solid #cfc5e5; background:#fff; color:var(--primary);
  border-radius:9px; padding:6px 9px; font-size:11px; font-weight:600; cursor:pointer;
}
.score-paper { padding:8px; background:#fff; }
.score-mount { width:100%; min-height:160px; }
.score-mount svg { display:block; width:100%; height:auto; }
.score-status {
  min-height:150px; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:24px; color:var(--muted); font-size:13px; line-height:1.7;
}
.score-foot {
  display:flex; flex-wrap:wrap; gap:10px 16px; padding:9px 12px;
  background:#fcfbfe; border-top:1px solid var(--border);
  color:#777; font-size:10px; line-height:1.5;
}
.midi-source {
  margin-top:10px; padding:9px 12px; border-radius:10px;
  background:var(--primary-light); color:#5e5270; font-size:10px; line-height:1.5;
  word-break:break-all;
}
.midi-source strong { color:var(--primary); margin-right:5px; }

.finger-guide { display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px; background:var(--primary-light); border-radius:10px; margin-bottom:12px; }
.fg { font-size:11px; padding:3px 8px; border-radius:14px; color:#fff; font-weight:600; }
.fg1{background:#e74c3c}.fg2{background:#e07b39}.fg3{background:#27ae60}.fg4{background:#2475a8}.fg5{background:#7c5cbf}

.boss-card { background:linear-gradient(135deg,#6c3fc5,#a855f7); border-radius:16px; padding:20px; text-align:center; color:#fff; margin-bottom:12px; }
.boss-card h3 { font-size:22px; margin-bottom:4px; }
.boss-card p { font-size:13px; opacity:.85; }
.locked-msg { font-size:14px; color:var(--muted); text-align:center; padding:20px; }

/* ── Tasks ── */
.week-header { font-size:13px; font-weight:700; color:var(--primary); margin-bottom:12px; }
.day-card { background:var(--card); border-radius:12px; margin-bottom:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.day-header { padding:14px 16px; display:flex; align-items:center; cursor:pointer; }
.day-num { width:36px; height:36px; border-radius:50%; background:var(--primary-light); color:var(--primary); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; margin-right:12px; flex-shrink:0; }
.day-num.done-day { background:#d5f5e3; color:#1a7a43; }
.day-num.rest-day { background:#f5f5f5; color:#aaa; }
.day-info { flex:1; }
.day-title { font-size:14px; font-weight:600; }
.day-sub { font-size:12px; color:var(--muted); margin-top:1px; }
.day-arrow { font-size:14px; color:var(--muted); transition:transform .2s; }
.day-arrow.open { transform:rotate(90deg); }
.day-tasks { padding:0 16px 12px; border-top:1px solid var(--border); display:none; }
.day-tasks.open { display:block; }
.task-item { display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.task-item:last-child { border-bottom:none; }
.task-check { width:22px; height:22px; border-radius:6px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; transition:all .2s; }
.task-check.checked { background:var(--primary); border-color:var(--primary); }
.task-check.checked::after { content:'✓'; color:#fff; font-size:13px; font-weight:700; }
.task-text { font-size:14px; line-height:1.5; }
.task-text.done { color:var(--muted); text-decoration:line-through; }

/* ── Landscape (手机/平板横屏，不是桌面浏览器宽窗口) ── */
@media (orientation:landscape) and (max-height:700px) {
  .tab-bar { display:none; }
  .hdr { height:44px; }
  .content { padding:8px 10px; }
  .sf-body { padding:8px 12px 12px; }
  .score-guide { margin-bottom:6px; }
  .score-key { padding:3px 8px; }
  .score-toolbar { min-height:36px; padding-top:4px; padding-bottom:4px; }
  .score-paper { padding:4px 8px; }
}

/* 手机/平板横屏：自动进入沉浸看谱，尽量把高度还给乐谱 */
@media (orientation:landscape) and (max-height:600px) {
  .sf-hdr {
    height:32px; padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
    gap:7px; box-shadow:none;
  }
  .sf-hdr-back { font-size:23px; padding-right:2px; }
  .sf-hdr-title { font-size:14px; }
  .sf-hdr-sub {
    font-size:9px; opacity:.85; cursor:pointer;
    padding:4px 7px; border:1px solid rgba(255,255,255,.3); border-radius:12px;
  }
  .sf-prof { display:none; }
  .sf-prof.landscape-open {
    display:flex; position:absolute; z-index:20; top:34px; right:8px;
    width:min(430px,calc(100% - 16px)); padding:5px; gap:5px;
    border:1px solid var(--border); border-radius:10px;
    box-shadow:0 5px 20px rgba(30,15,60,.22);
  }
  .sf-prof.landscape-open .sf-prof-btn {
    display:flex; flex:1; justify-content:center; padding:4px 5px;
  }
  .sf-body { padding:3px 8px max(6px,env(safe-area-inset-bottom)); }
  .score-guide { display:none; }
  .score-card { border-radius:7px; box-shadow:none; }
  .score-toolbar { min-height:29px; padding:2px 6px 2px 9px; }
  .score-facts { font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-toggle { padding:4px 7px; border-radius:7px; font-size:9px; }
  .score-paper { padding:0 3px 3px; }
  .score-foot, .midi-source { display:none; }
}

/* ── Section label ── */
.section-lbl { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin:16px 0 8px; }

/* ── Courses ── */
.course-card { background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); cursor:pointer; }
.course-card-title { font-size:16px; font-weight:600; margin-bottom:6px; }
.course-card-sub { font-size:12px; color:var(--muted); margin-bottom:8px; }
.course-progress-track { height:6px; border-radius:4px; background:var(--primary-light); overflow:hidden; }
.course-progress-fill { height:100%; background:var(--primary); border-radius:4px; transition:width .2s; }
.add-course-btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:14px; border-radius:12px; border:2px dashed var(--border); color:var(--primary); font-weight:600; cursor:pointer; margin-bottom:10px; }
.course-resume { background:#fff; border:2px solid var(--primary); border-radius:12px; padding:16px; margin-bottom:18px; box-shadow:0 2px 8px rgba(42,24,80,.08); }
.course-resume-kicker { color:var(--primary); font-size:11px; font-weight:700; letter-spacing:1px; margin-bottom:5px; }
.course-resume-title { font-size:18px; font-weight:700; line-height:1.35; }
.course-resume-meta { color:var(--muted); font-size:12px; line-height:1.5; margin:5px 0 13px; }
.course-resume-actions { display:flex; gap:8px; }
.course-resume-actions .btn { flex:1; }
.course-list-heading { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:1px; margin:4px 0 9px; }
.ptime-widget { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:16px; display:flex; flex-direction:column; gap:10px; cursor:default; }
.ptime-bar-row { display:grid; grid-template-columns:5em 1fr auto; align-items:center; gap:10px; cursor:pointer; border-radius:6px; padding:3px 2px; transition:background 0.15s; }
.ptime-bar-row:hover { background:var(--border); }
.ptime-bar-label { font-size:13px; font-weight:500; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ptime-bar-label--active { color:var(--text); font-weight:700; }
.ptime-bar-track { height:10px; background:var(--border); border-radius:5px; overflow:hidden; min-width:60px; }
.ptime-bar-fill { height:100%; border-radius:5px; transition:width 0.4s ease; }
.ptime-bar-fill--0 { background:#2a78d6; }
.ptime-bar-fill--1 { background:#eb6834; }
.ptime-bar-value { font-size:12px; font-weight:700; white-space:nowrap; min-width:5em; text-align:right; }
.ptime-bar-value--0 { color:#2a78d6; }
.ptime-bar-value--1 { color:#eb6834; }
@media (prefers-color-scheme:dark) {
  .ptime-bar-fill--0 { background:#3987e5; } .ptime-bar-value--0 { color:#3987e5; }
  .ptime-bar-fill--1 { background:#d95926; } .ptime-bar-value--1 { color:#d95926; }
}
:root[data-theme="dark"] .ptime-bar-fill--0 { background:#3987e5; } :root[data-theme="dark"] .ptime-bar-value--0 { color:#3987e5; }
:root[data-theme="dark"] .ptime-bar-fill--1 { background:#d95926; } :root[data-theme="dark"] .ptime-bar-value--1 { color:#d95926; }
:root[data-theme="light"] .ptime-bar-fill--0 { background:#2a78d6; } :root[data-theme="light"] .ptime-bar-value--0 { color:#2a78d6; }
:root[data-theme="light"] .ptime-bar-fill--1 { background:#eb6834; } :root[data-theme="light"] .ptime-bar-value--1 { color:#eb6834; }
.ptime-live-dot { color:#e05a2b; font-size:9px; margin-left:4px; animation:blink 1s step-start infinite; }
@keyframes blink { 50% { opacity:0; } }
.practice-timer-live { font-size:11px; color:var(--primary); font-weight:600; text-align:center; }
.practice-overtime-banner { width:min(100%,900px); padding:10px 14px; margin-bottom:10px; border-radius:8px; background:#fff8e6; border:1.5px solid #f5c842; color:#7a5800; font-size:13px; font-weight:600; text-align:center; }

.field { margin-bottom:14px; }
.field-label { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; display:block; }
.field select, .field input[type=text], .field input[type=number] {
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border);
  font-size:14px; background:#fff; color:var(--text);
}
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; border:none; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:disabled { opacity:.45; cursor:default; }
.btn-secondary { background:var(--primary-light); color:var(--primary); }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.upload-drop { border:2px dashed var(--border); border-radius:12px; padding:18px; text-align:center; color:var(--muted); font-size:13px; margin-bottom:14px; }

.track-table { width:100%; border-collapse:collapse; margin-bottom:14px; font-size:13px; }
.track-table th, .track-table td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
.track-table th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; }

.stage-header { font-size:12px; font-weight:700; color:var(--primary); letter-spacing:1px; text-transform:uppercase; margin:18px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--primary-light); }
.lesson-row { background:var(--card); border-radius:10px; padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.lesson-row.locked { opacity:.5; }
.lesson-row-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.lesson-title { font-size:14px; font-weight:600; }
.lesson-meta { font-size:11px; color:var(--muted); margin-top:2px; }
.lesson-badges { display:flex; gap:5px; flex-shrink:0; }
.lesson-badge { font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; white-space:nowrap; }
.badge-hand-right { background:#ddeeff; color:#1a6fa8; }
.badge-hand-left { background:#fde8cc; color:#a05a00; }
.badge-hand-both { background:#d5f5e3; color:#1a7a43; }
.badge-done { background:#eafaf1; color:#1a6b3a; }
.lesson-actions { display:flex; gap:8px; margin-top:10px; }
.lesson-actions .btn { padding:7px 12px; font-size:12px; }

.toast { position:fixed; left:50%; bottom:calc(var(--tab-h) + 16px); transform:translateX(-50%); background:rgba(20,15,35,.9); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:500; max-width:88%; text-align:center; }
.error-text { color:#c0392b; font-size:12px; margin-top:6px; }
.empty-hint { color:var(--muted); font-size:13px; text-align:center; padding:24px 0; }

/* ── Practice session (Web MIDI 实时评分) ── */
.practice-wrap { display:flex; flex-direction:column; align-items:center; width:100%; padding:10px 0 30px; }
.practice-progress { font-size:12px; color:var(--muted); margin-bottom:18px; }
.practice-stage { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; justify-content:center; }
.practice-dot { width:9px; height:9px; border-radius:50%; background:var(--border); }
.practice-dot.done-clean { background:#2ecc71; }
.practice-dot.done-mess { background:#f39c12; }
.practice-dot.current { background:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
.practice-target { background:var(--card); border-radius:16px; padding:28px 24px; min-width:220px; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:18px; }
.practice-target-notes { font-size:34px; font-weight:700; letter-spacing:2px; margin-bottom:6px; }
.practice-target-hand { font-size:12px; }
.practice-run-progress { color:var(--muted); font-size:12px; margin:-10px 0 14px; }
.practice-run-progress strong { color:var(--primary); }
.practice-lesson-meta { width:min(100%,900px); display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 10px; }
.practice-lesson-meta .practice-progress { margin:0; font-weight:700; color:var(--text); }
.practice-lesson-meta .practice-run-progress { margin:0; text-align:right; }
.practice-lesson-meta .practice-stage { margin:0; flex:0 0 auto; }
.practice-now-summary { width:min(100%,900px); display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:0 0 10px; padding:10px 12px; border:1px solid #ddd2f3; border-left:4px solid #6c3fc5; border-radius:8px; background:#faf8ff; }
.practice-now-label { color:#6c3fc5; font-size:11px; font-weight:800; }
.practice-now-summary strong { color:var(--text); font-size:18px; letter-spacing:0; }
.practice-now-summary .lesson-badge { margin-left:auto; }
.practice-finger-guide { width:min(100%,900px); margin:0 0 16px; }
.practice-finger-title { color:var(--muted); font-size:11px; font-weight:700; margin:0 0 7px 2px; }
.practice-finger-list { display:grid; grid-template-columns:repeat(auto-fit, minmax(126px, 1fr)); gap:8px; }
.practice-finger-card { border:1px solid var(--border); border-left:4px solid #4c8bc7; border-radius:8px; background:var(--card); padding:9px 10px; min-width:0; }
.practice-finger-card.left { border-left-color:#d88732; }
.practice-finger-top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.practice-finger-hand { color:var(--muted); font-size:10px; font-weight:700; }
.practice-finger-note { color:var(--text); font-size:18px; font-weight:800; }
.practice-finger-detail { color:var(--text); font-size:12px; font-weight:700; margin-top:4px; }
.practice-finger-key { color:var(--muted); font-size:10px; margin-top:3px; }
.practice-finger-key kbd { background:#f1eff8; border:1px solid #d8d3e5; border-radius:4px; color:var(--text); font-family:inherit; font-weight:700; padding:1px 4px; }
.practice-sheet { width:min(100%,900px); margin:4px 0 16px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; }
.practice-sheet-head { display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:10px 12px; border-bottom:1px solid var(--border); background:#fcfbfe; }
.practice-sheet-head strong { font-size:13px; }
.practice-sheet-head span { color:var(--muted); font-size:10px; text-align:right; }
.practice-sheet.lesson-score .score-paper { background:#fffefd; }
.practice-score-legend .pointer { background:#6c3fc5; clip-path:polygon(50% 100%, 0 0, 100% 0); border-radius:0; }
.practice-score-legend { display:flex; flex-wrap:wrap; gap:8px 12px; padding:7px 12px; border-top:1px solid var(--border); background:#fcfbfe; color:var(--muted); font-size:10px; }
.practice-score-legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; background:#d4cfd6; }
.practice-score-legend .target { background:#4c8bc7; }
.practice-score-legend .current { background:#6c3fc5; }
.practice-score-legend .done { background:#1a9b6d; }
.practice-stats { display:flex; gap:18px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
.practice-stat { text-align:center; }
.practice-stat-val { font-size:20px; font-weight:700; }
.practice-stat-lbl { font-size:11px; color:var(--muted); }
.midi-status-card { width:min(100%,520px); margin:8px 0 18px; background:var(--card); border:1px solid #e0d9ee; border-top:3px solid var(--primary); border-radius:8px; padding:20px 22px; text-align:center; box-shadow:var(--shadow-sm); }
.midi-status-icon { font-size:26px; line-height:1; margin-bottom:9px; }
.midi-status-card > div:nth-child(2) { color:var(--text); font-size:13px; line-height:1.6; }
.midi-status-card .btn-row { margin-top:15px; }
.practice-input-note { font-size:12px; color:var(--muted); margin:-8px 0 14px; text-align:center; }
.practice-input-note strong { color:var(--text); }
.pc-keyboard { width:min(100%,360px); margin:0 0 20px; }
.pc-keyboard-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; margin-bottom:8px; font-size:12px; font-weight:700; }
.pc-keyboard-head span { color:var(--muted); font-weight:400; }
.pc-key-grid { display:grid; grid-template-columns:repeat(9, minmax(0, 1fr)); gap:4px; }
.pc-key { min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px solid var(--border); border-radius:5px; background:#fff; color:var(--text); }
.pc-key.sharp { background:#4b465a; border-color:#4b465a; color:#fff; }
.pc-key.target { border:2px solid var(--primary); background:var(--primary-light); color:var(--primary); font-weight:700; }
.pc-key.sharp.target { background:var(--primary); border-color:var(--primary); color:#fff; }
.pc-key-code { font-size:13px; line-height:1; }
.pc-key-note { font-size:9px; line-height:1; opacity:.72; }
.pc-keyboard-controls { display:flex; justify-content:center; gap:8px; margin-top:10px; }
.pc-keyboard-controls button { min-width:84px; }
.pc-keyboard-warning { color:#a05a00; font-size:11px; line-height:1.45; margin-top:8px; text-align:center; }
.result-card { background:var(--card); border-radius:16px; padding:24px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.1); max-width:320px; width:100%; }
.result-score { font-size:42px; font-weight:800; color:var(--primary); }
.result-stars { color:#d99800; font-size:27px; letter-spacing:3px; line-height:1.25; margin-top:4px; }
.result-star-label { color:var(--muted); font-size:11px; margin:1px 0 7px; }
.result-best { color:#5f5670; font-size:11px; margin:-10px 0 15px; }
.result-pass { font-size:14px; font-weight:700; margin:6px 0 16px; }
.result-pass.pass { color:#1a7a43; }
.result-pass.fail { color:#a05a00; }
.result-next { color:var(--muted); font-size:12px; margin:-10px 0 15px; }
.result-countdown { color:var(--primary); font-size:13px; font-weight:700; margin:-6px 0 15px; }
.result-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:12px; text-align:left; margin-bottom:16px; }
.result-grid div span { display:block; color:var(--muted); font-size:10px; }

/* ── UI refinement: course workbench and training library ── */
:root {
  --bg: #f6f5fa;
  --surface: #ffffff;
  --card: #ffffff;
  --primary: #6243bd;
  --primary-light: #f0edfb;
  --text: #24212d;
  --muted: #746f7e;
  --border: #e5e1ec;
  --shadow-sm: 0 1px 2px rgba(26, 20, 40, .05), 0 5px 18px rgba(26, 20, 40, .045);
}
body { background:var(--bg); }
.hdr { height:64px; padding:0; color:var(--text); background:rgba(255,255,255,.96); border-bottom:1px solid var(--border); box-shadow:none; }
.hdr-shell { width:min(1180px,100%); height:100%; margin:0 auto; padding:0 24px; display:flex; align-items:center; min-width:0; }
.hdr-title { font-size:16px; font-weight:780; letter-spacing:0; }
.hdr-title::before { content:'Piano Flow'; color:var(--primary); font-size:12px; font-weight:800; letter-spacing:.4px; margin-right:10px; }
.hdr-back { width:32px; height:32px; margin-right:12px; border:1px solid var(--border); border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-size:24px; line-height:1; color:var(--text); background:#fff; }
.content { padding:24px 28px 18px; background:var(--bg); }
.content-inner { width:min(1180px,100%); margin:0 auto; }
.tab-bar { height:68px; padding:0 max(18px,calc((100vw - 1180px) / 2)); gap:8px; background:rgba(255,255,255,.96); border-top:1px solid var(--border); }
.tab { flex:0 0 auto; min-width:92px; padding:8px 14px; flex-direction:row; gap:7px; font-size:12px; font-weight:700; color:#756f7d; border-radius:0; }
.tab.active { color:var(--primary); }
.tab.active::after { content:''; position:absolute; width:28px; height:3px; bottom:0; border-radius:3px 3px 0 0; background:var(--primary); }
.tab { position:relative; }
.tab .icon { font-size:18px; line-height:1; }

.course-home, .drill-home { display:flex; flex-direction:column; gap:24px; padding-bottom:20px; }
.course-home-top { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(300px,.72fr); gap:18px; align-items:stretch; }
.course-resume { min-height:172px; margin:0; padding:22px 24px; border:1px solid #d9d0f3; border-left:4px solid var(--primary); border-radius:8px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; align-items:flex-start; justify-content:center; }
.course-resume-kicker, .course-list-heading, .course-section-eyebrow { color:var(--primary); font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; }
.course-resume-title { font-size:23px; line-height:1.22; margin:7px 0 4px; letter-spacing:0; }
.course-resume-meta { margin:0 0 16px; font-size:13px; }
.course-resume-actions { width:min(100%,440px); }
.btn { min-height:38px; padding:9px 14px; border-radius:7px; font-weight:750; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
.btn-primary { background:var(--primary); box-shadow:0 3px 9px rgba(98,67,189,.19); }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 5px 14px rgba(98,67,189,.25); }
.btn-secondary { background:#f1eff7; color:#4f4762; }
.ptime-widget { min-height:172px; margin:0; padding:19px 20px; border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:var(--shadow-sm); justify-content:center; }
.ptime-widget::before { content:'今日练习时间'; color:var(--text); font-size:13px; font-weight:800; margin-bottom:2px; }
.ptime-bar-row { grid-template-columns:4.6em 1fr auto; padding:5px 2px; }
.ptime-bar-track { height:7px; background:#eeebf3; }
.ptime-bar-fill--0 { background:#4d83cf; }
.ptime-bar-fill--1 { background:#d87547; }
.ptime-bar-value { min-width:4.8em; font-size:11px; }

.course-section { display:flex; flex-direction:column; gap:12px; }
.course-section-head { display:flex; align-items:end; justify-content:space-between; gap:12px; }
.course-section-title { color:var(--text); font-size:20px; line-height:1.15; font-weight:800; }
.course-section-meta { color:var(--muted); font-size:12px; text-align:right; }
.course-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.course-card { min-height:142px; margin:0; padding:16px 17px; border:1px solid var(--border); border-radius:8px; box-shadow:none; display:flex; flex-direction:column; gap:9px; overflow:hidden; background:var(--card); transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
.course-card:hover { border-color:#c6b8ec; box-shadow:var(--shadow-sm); transform:translateY(-1px); }
.course-card-top { display:flex; align-items:flex-start; gap:11px; min-width:0; }
.course-card-mark { width:34px; height:34px; flex:0 0 34px; border-radius:7px; display:grid; place-items:center; background:#edf3ff; color:#3b6eb5; font-size:12px; font-weight:850; }
.course-card--drill-fingering .course-card-mark { background:#fff0e9; color:#bd6036; }
.course-card--drill-technique .course-card-mark { background:#e9f6ef; color:#26785a; }
.course-card-main { min-width:0; flex:1; }
.course-card-title { margin:0; font-size:15px; font-weight:780; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.course-card-sub { margin:3px 0 0; color:var(--muted); font-size:11px; }
.course-card-status { color:var(--primary); font-size:11px; font-weight:800; white-space:nowrap; }
.course-card-foot { margin-top:auto; display:flex; align-items:center; gap:10px; }
.course-progress-track { flex:1; height:6px; background:#efedf3; border-radius:999px; }
.course-progress-fill { background:var(--primary); border-radius:999px; }
.course-card-progress { color:var(--muted); font-size:11px; white-space:nowrap; }
.course-card-arrow { color:#958ba9; font-size:20px; line-height:1; }
.training-portal { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:16px; padding:18px 20px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); cursor:pointer; }
.training-portal-mark { width:40px; height:40px; border-radius:7px; display:grid; place-items:center; background:#f3f0fc; color:var(--primary); font-size:19px; }
.training-portal-title { color:var(--text); font-size:16px; font-weight:800; }
.training-portal-copy { color:var(--muted); font-size:12px; margin-top:3px; }
.training-portal-action { color:var(--primary); font-size:12px; font-weight:800; white-space:nowrap; }
.add-course-btn { min-height:72px; margin:0; border:1px dashed #c9c1d8; border-radius:8px; background:transparent; color:#5e5373; font-size:13px; }

.drill-intro { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:end; padding:4px 0 2px; }
.drill-intro h2 { margin:4px 0 7px; color:var(--text); font-size:26px; line-height:1.18; letter-spacing:0; }
.drill-intro p { max-width:650px; color:var(--muted); font-size:13px; line-height:1.7; }
.drill-stat-list { display:flex; gap:10px; }
.drill-stat { min-width:88px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:#fff; }
.drill-stat strong { display:block; color:var(--text); font-size:19px; line-height:1; }
.drill-stat span { color:var(--muted); font-size:11px; }
.drill-filter { display:flex; gap:4px; padding:4px; width:max-content; border:1px solid var(--border); border-radius:8px; background:#fff; }
.drill-filter button { min-height:32px; padding:0 12px; border:0; border-radius:5px; background:transparent; color:var(--muted); font:inherit; font-size:12px; font-weight:750; cursor:pointer; }
.drill-filter button.active { color:#fff; background:var(--primary); }
.drill-section-note { color:var(--muted); font-size:12px; }

.practice-wrap { padding:4px 0 34px; }
.practice-lesson-meta, .practice-sheet, .practice-now-summary, .practice-finger-guide { width:min(100%,980px); }
.practice-lesson-meta { min-height:42px; padding:0 2px; }
.practice-sheet { margin:0 0 14px; border-radius:8px; border-color:#ddd8e7; box-shadow:var(--shadow-sm); }
.practice-sheet-head { min-height:46px; padding:10px 14px; background:#fff; }
.practice-sheet-head strong { font-size:14px; }
.practice-sheet-head span { max-width:54%; line-height:1.45; }
.practice-now-summary { min-height:50px; padding:11px 13px; background:#fbfaff; border-color:#ddd6ee; }
.practice-finger-list { grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
.practice-finger-card { min-height:76px; box-shadow:none; }
.pc-keyboard { width:min(100%,620px); padding:14px; border:1px solid var(--border); border-radius:8px; background:#fff; box-shadow:var(--shadow-sm); }
.pc-key { min-height:54px; border-radius:5px; }
.practice-stats { margin:2px 0 16px; }

@media (max-width:720px) {
  .hdr { height:52px; }
  .hdr-shell { padding:0 14px; }
  .hdr-title { font-size:15px; }
  .hdr-title::before { display:none; }
  .hdr-back { width:28px; height:28px; margin-right:9px; }
  .content { padding:14px 12px 12px; }
  .tab-bar { height:62px; padding:0 3px; gap:0; justify-content:space-around; }
  .tab { min-width:0; flex:1; padding:6px 3px; flex-direction:column; gap:2px; font-size:10px; }
  .tab .icon { font-size:17px; }
  .course-home, .drill-home { gap:18px; }
  .course-home-top { grid-template-columns:1fr; gap:12px; }
  .course-resume, .ptime-widget { min-height:0; padding:17px; }
  .course-resume-title { font-size:19px; }
  .course-section-head { align-items:start; }
  .course-section-title { font-size:18px; }
  .course-section-meta { max-width:45%; font-size:11px; }
  .course-grid { grid-template-columns:1fr; gap:9px; }
  .course-card { min-height:118px; padding:14px; }
  .training-portal { grid-template-columns:auto minmax(0,1fr); gap:11px; padding:15px 4px; }
  .training-portal-action { grid-column:2; }
  .drill-intro { grid-template-columns:1fr; gap:14px; }
  .drill-intro h2 { font-size:22px; }
  .drill-stat-list { gap:7px; }
  .drill-stat { min-width:0; flex:1; padding:9px 10px; }
  .drill-filter { width:100%; }
  .drill-filter button { flex:1; padding:0 7px; }
  .practice-lesson-meta { display:grid; grid-template-columns:1fr auto; gap:7px 10px; padding:0; }
  .practice-lesson-meta .practice-stage { grid-column:1 / -1; justify-content:flex-start; order:3; }
  .practice-lesson-meta .practice-run-progress { text-align:right; }
  .practice-sheet-head { align-items:flex-start; flex-direction:column; gap:3px; }
  .practice-sheet-head span { max-width:100%; text-align:left; }
  .practice-now-summary strong { font-size:16px; }
  .practice-now-summary .lesson-badge { margin-left:0; }
  .practice-finger-list { grid-template-columns:1fr; }
  .pc-keyboard { padding:10px; }
  .pc-key { min-height:47px; }
}

@media (orientation:landscape) and (max-height:700px) {
  .tab-bar { display:flex; height:48px; }
  .tab { flex-direction:row; min-width:82px; font-size:11px; }
  .content { padding:10px 18px; }
  .course-home-top { grid-template-columns:minmax(0,1.35fr) minmax(260px,.75fr); }
  .course-resume, .ptime-widget { min-height:136px; padding:15px 18px; }
  .course-resume-title { font-size:18px; }
  .course-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .course-card { min-height:108px; padding:12px; }
}

/* ── Stable score layout ── */
.practice-score-layout {
  display:grid;
  grid-template-columns:minmax(168px,190px) minmax(0,1fr);
  gap:16px;
  align-items:start;
  width:min(100%,1160px);
  margin-top:26px;
}
#root[data-render-key^="practice:"] .hdr-shell,
#root[data-render-key^="practice:"] .content-inner {
  width:min(1600px,100%);
}
#root[data-render-key^="practice:"] .practice-score-layout {
  width:100%;
}
.practice-finger-float { position:sticky; top:118px; min-width:0; }
.practice-finger-guide { width:100%; margin:0; }
.practice-finger-title { margin:0 0 6px 2px; color:var(--muted); font-size:10px; font-weight:800; }
.practice-finger-list { grid-template-columns:1fr; gap:7px; }
.practice-finger-card { min-height:64px; padding:8px 10px; border-radius:7px; background:#fff; }
.practice-finger-note { font-size:16px; }
.practice-finger-detail { margin-top:3px; font-size:11px; }
.practice-finger-key { margin-top:2px; font-size:10px; }
.practice-sheet { width:min(100%,980px); }
.practice-score-main, .practice-score-main .practice-sheet { width:100%; min-width:0; }
.practice-sheet-head { align-items:center; padding:10px 14px; }
.practice-sheet-title { display:flex; flex-direction:column; gap:3px; min-width:0; }
.practice-sheet-title strong { font-size:14px; }
.practice-sheet-title span { max-width:none; text-align:left; }
.score-mode-switch { display:flex; flex:0 0 auto; gap:3px; padding:3px; border:1px solid var(--border); border-radius:7px; background:#f7f5fa; }
.score-mode-button { min-height:28px; padding:4px 9px; border:0; border-radius:5px; background:transparent; color:var(--muted); font:inherit; font-size:11px; font-weight:750; cursor:pointer; }
.score-mode-button.active { color:#fff; background:var(--primary); box-shadow:0 2px 5px rgba(98,67,189,.18); }
.score-mode-button:focus-visible { outline:2px solid #9f84df; outline-offset:1px; }

@media (max-width:720px) {
  .practice-finger-list { grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); }
  .practice-finger-card { min-height:60px; padding:7px 8px; }
  .practice-sheet-head { align-items:stretch; }
  .score-mode-switch { width:100%; }
  .score-mode-button { flex:1; padding-left:4px; padding-right:4px; }
}

@media (max-width:1200px) {
  .practice-score-layout { display:flex; flex-direction:column; gap:8px; margin-top:0; }
  .practice-finger-float { position:static; order:1; width:100%; }
  .practice-score-main { order:2; }
  .practice-finger-list { grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); }
}

@media (orientation:landscape) and (max-height:700px) {
  .practice-score-layout { display:block; width:100%; margin-top:0; }
  .practice-finger-float { display:none; }
  .practice-sheet-head { padding:6px 10px; }
  .practice-sheet-title span { font-size:9px; }

// ── Practice time helpers ─────────────────────────────────────────────────

function formatPracticeTime(totalSeconds) {
  const s = Math.floor(totalSeconds || 0);
  if (s < 60) return s > 0 ? `${s}秒` : '0秒';
  const YEAR = 365 * 24 * 3600, MONTH = 30 * 24 * 3600, DAY = 24 * 3600, HOUR = 3600, MIN = 60;
  let rem = s;
  const years  = Math.floor(rem / YEAR);  rem %= YEAR;
  const months = Math.floor(rem / MONTH); rem %= MONTH;
  const days   = Math.floor(rem / DAY);   rem %= DAY;
  const hours  = Math.floor(rem / HOUR);  rem %= HOUR;
  const mins   = Math.floor(rem / MIN);
  return [years && `${years}年`, months && `${months}月`, days && `${days}日`,
          hours && `${hours}小时`, mins && `${mins}分钟`].filter(Boolean).join('') || '不足1分钟';
}

function onPracticeActivity() {
  const timer = state.practiceTimer;
  const now = Date.now();
  if (!timer.active) { timer.active = true; timer.startTime = now; }
  timer.lastActivity = now;
}

async function endPracticeTimerSession(seconds) {
  const timer = state.practiceTimer;
  timer.active = false; timer.startTime = null; timer.lastActivity = null;
  state.practiceTimeWarning = false;
  if (!(seconds > 0)) return;
  const user = state.currentUser;
  state.practiceTimeStats[user] = (state.practiceTimeStats[user] || 0) + seconds;
  render();
  try { await apiPost('/api/practice-time', { user, seconds }); } catch (e) { /* best-effort */ }
}

setInterval(async () => {
  const timer = state.practiceTimer;
  if (!timer.active || !timer.lastActivity) return;
  const now = Date.now();
  if (now - timer.lastActivity >= IDLE_TIMEOUT_MS) {
    const toCredit = Math.max(0, Math.floor((timer.lastActivity - timer.startTime) / 1000));
    await endPracticeTimerSession(toCredit);
  } else {
    // 检查是否超过 20 分钟，首次触发时强制刷新以显示提醒
    const elapsed = Math.floor((now - timer.startTime) / 1000);
    if (elapsed >= 1200 && !state.practiceTimeWarning) {
      state.practiceTimeWarning = true;
      render();
    } else if (state.view === 'practice-session') {

}, 1000);

// ═══════════════════════════════════════

const SVG_NS = 'http://www.w3.org/2000/svg';
const PITCH_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const DIATONIC_CLASS = [0,0,1,1,2,3,3,4,4,5,5,6];

function svgEl(tag, attrs = {}, text = '') {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value !== undefined && value !== null) node.setAttribute(key, value);
  }
  if (text) node.textContent = text;
  return node;
}

function midiName(midi) {
  const octave = Math.floor(midi / 12) - 1;
  return `${PITCH_NAMES[midi % 12]}${octave}`;
}

function staffPosition(midi, clef) {
  const octave = Math.floor(midi / 12) - 1;
  const absoluteStep = octave * 7 + DIATONIC_CLASS[midi % 12];
  const bottomLineStep = clef === 'bass' ? 18 : 30; // bass G2 / treble E4
  return absoluteStep - bottomLineStep;
}

function noteY(midi, clef, staffTop) {
  return staffTop + 40 - staffPosition(midi, clef) * 5;
}

function drawLedgerLines(svg, x, position, staffTop, ink = '#25222a') {
  if (position < 0) {
    for (let p = -2; p >= position; p -= 2) {
      const y = staffTop + 40 - p * 5;
      svg.appendChild(svgEl('line', { x1:x-10, x2:x+10, y1:y, y2:y, stroke:ink, 'stroke-width':1.2 }));
    }
  } else if (position > 8) {
    for (let p = 10; p <= position; p += 2) {
      const y = staffTop + 40 - p * 5;
      svg.appendChild(svgEl('line', { x1:x-10, x2:x+10, y1:y, y2:y, stroke:ink, 'stroke-width':1.2 }));
    }
  }
}

function drawClef(svg, clef, staffTop, showTime, numerator, denominator) {
  const isBass = clef === 'bass';
  svg.appendChild(svgEl('text', {
    x:isBass ? 22 : 16,
    y:isBass ? staffTop + 37 : staffTop + 46,
    'font-size':isBass ? 43 : 55,
    'font-family':'Segoe UI Symbol, Noto Music, serif',
    fill:'#24202a',
  }, isBass ? '𝄢' : '𝄞'));

  if (showTime) {
    const x = 61;
    svg.appendChild(svgEl('text', {
      x, y:staffTop + 17, 'text-anchor':'middle', 'font-size':16,
      'font-family':'Georgia, serif', 'font-weight':'700', fill:'#24202a',
    }, String(numerator)));
    svg.appendChild(svgEl('text', {
      x, y:staffTop + 36, 'text-anchor':'middle', 'font-size':16,
      'font-family':'Georgia, serif', 'font-weight':'700', fill:'#24202a',
    }, String(denominator)));
  }
}

const NOTE_TONE = {
  default: '#24202a',
  inactive: '#d4cfd6',
  target: '#4c8bc7',
  current: '#6c3fc5',
  done: '#1a9b6d',
  mistake: '#d88732',
};

function drawNote(svg, note, x, clef, staffTop, showNames, fingerNum, tone = 'default', annotation = null, stackIndex = 0, systemIndex = 0) {
  const position = staffPosition(note.midi, clef);
  const y = noteY(note.midi, clef, staffTop);
  const duration = note.duration;
  const hollow = duration >= 1.75;
  const whole = duration >= 3.75;
  const stemUp = position <= 4;
  const ink = NOTE_TONE[tone] || NOTE_TONE.default;

  drawLedgerLines(svg, x, position, staffTop, ink);

  if ([1,3,6,8,10].includes(note.midi % 12)) {
    svg.appendChild(svgEl('text', {
      x:x-13, y:y+5, 'text-anchor':'middle', 'font-size':16,
      'font-family':'Segoe UI Symbol, serif', fill:ink,
    }, '♯'));
  }

  svg.appendChild(svgEl('ellipse', {
    cx:x, cy:y, rx:6.2, ry:4.5,
    transform:`rotate(-16 ${x} ${y})`,
    fill:hollow ? '#fff' : ink,
    stroke:ink, 'stroke-width':hollow ? 1.8 : 1,
  }));

  if (!whole) {
    const stemX = stemUp ? x + 5.5 : x - 5.5;
    const stemEndY = stemUp ? y - 30 : y + 30;
    svg.appendChild(svgEl('line', {
      x1:stemX, x2:stemX, y1:y, y2:stemEndY,
      stroke:ink, 'stroke-width':1.5,
    }));

    if (duration <= 0.75) {
      const path = stemUp
        ? `M ${stemX} ${stemEndY} Q ${stemX+13} ${stemEndY+5} ${stemX+9} ${stemEndY+17}`
        : `M ${stemX} ${stemEndY} Q ${stemX-13} ${stemEndY-5} ${stemX-9} ${stemEndY-17}`;
      svg.appendChild(svgEl('path', {
        d:path, fill:'none', stroke:ink, 'stroke-width':2.2, 'stroke-linecap':'round',
      }));
    }
  }

  if ([0.75,1.5,3].some(value => Math.abs(duration - value) < 0.08)) {
    svg.appendChild(svgEl('circle', { cx:x+10, cy:y, r:1.8, fill:ink }));
  }

  if (showNames) {
    // 和弦时多个音符的灰色音名标签按 stackIndex 向下错开，避免同列重叠
    svg.appendChild(svgEl('text', {
      x, y:staffTop + 83 + stackIndex * 14, 'text-anchor':'middle', 'font-size':9.5,
      'font-family':'Arial, sans-serif', 'font-weight':'600', fill:'#7b7188',
    }, midiName(note.midi)));
  }

  if (annotation?.letter && annotation.showLetter !== false) {
    // 和弦时彩色音名标签同样按 stackIndex 向下错开
    svg.appendChild(svgEl('text', {
      x, y:staffTop + 76 + stackIndex * 14, 'text-anchor':'middle', 'font-size':11,
      'font-family':'Arial, sans-serif', 'font-weight':'800', fill:ink,
    }, annotation.letter));
  }

  // 指法数字样式统一：只要显示就带框（曲目库预览与练习评分页一致），不再区分来源。
  const displayedFinger = annotation?.showFinger === false
    ? null
    : (annotation?.finger ?? fingerNum);
  if (displayedFinger) {
    const fy = clef === 'treble'
      ? (stemUp ? y - 38 : y - 16)
      : (stemUp ? y + 44 : y + 22);
    // 按 stackIndex 向上错开；Math.max(16,...) 保证框体不飞出 SVG 顶部：
    // 最小 boxY=16 → rect 顶边=4，即使长序列累积多级也不会超出画布。
    const boxY = Math.max(16, Math.min(fy, staffTop - 8) - stackIndex * 16);
    svg.appendChild(svgEl('rect', {
      x:x-8, y:boxY-12, width:16, height:14, rx:2,
      fill:'#fff', stroke:ink, 'stroke-width':1.2,
    }));
    svg.appendChild(svgEl('text', {
      x, y:boxY-2, 'text-anchor':'middle', 'font-size':9,
      'font-family':'Arial, sans-serif', 'font-weight':'800', fill:ink,
    }, String(displayedFinger)));
  }

  // 当前要弹奏的音符：记录所在系统，换行时只滚动一次。
  if (tone === 'current') {
    svg.appendChild(svgEl('circle', {
      class:'practice-current-anchor',
      'data-practice-system':String(systemIndex),
      cx:x, cy:y, r:0, fill:'none',
    }));
  }
}

function splitRestGap(start, duration, beatsPerMeasure) {
  const rests = [];
  let cursor = start;
  let remaining = duration;
  const choices = [4, 2, 1, 0.5];

  while (remaining >= 0.49) {
    const offset = ((cursor % beatsPerMeasure) + beatsPerMeasure) % beatsPerMeasure;
    const toBoundary = Math.abs(offset) < 0.01 ? beatsPerMeasure : beatsPerMeasure - offset;
    const available = Math.min(remaining, toBoundary);
    const piece = choices.find(value => value <= available + 0.01);
    if (!piece) break;
    rests.push({ start:cursor, duration:piece });
    cursor += piece;
    remaining -= piece;
  }
  return rests;
}

function buildRests(track, totalBeats, beatsPerMeasure) {
  const rests = [];
  let cursor = 0;
  for (const note of track.notes) {
    if (note.start - cursor >= 0.49) {
      rests.push(...splitRestGap(cursor, note.start - cursor, beatsPerMeasure));
    }
    cursor = Math.max(cursor, note.start + note.duration);
  }
  if (totalBeats - cursor >= 0.49) {
    rests.push(...splitRestGap(cursor, totalBeats - cursor, beatsPerMeasure));
  }
  return rests;
}

function drawRest(svg, rest, x, staffTop) {
  const duration = rest.duration;
  if (duration >= 3.75) {
    svg.appendChild(svgEl('rect', { x:x-7, y:staffTop+10, width:14, height:5, fill:'#24202a' }));
  } else if (duration >= 1.75) {
    svg.appendChild(svgEl('rect', { x:x-7, y:staffTop+15, width:14, height:5, fill:'#24202a' }));
  } else if (duration >= 0.75) {
    svg.appendChild(svgEl('path', {
      d:`M ${x-3} ${staffTop+6} l 7 8 l -6 7 l 7 7 l -7 10`,
      fill:'none', stroke:'#24202a', 'stroke-width':2.3,
      'stroke-linecap':'round', 'stroke-linejoin':'round',
    }));
  } else {
    svg.appendChild(svgEl('circle', { cx:x+3, cy:staffTop+13, r:2.8, fill:'#24202a' }));
    svg.appendChild(svgEl('path', {
      d:`M ${x+2} ${staffTop+15} Q ${x+1} ${staffTop+25} ${x-5} ${staffTop+32}`,
      fill:'none', stroke:'#24202a', 'stroke-width':1.8, 'stroke-linecap':'round',
    }));
  }
}

function drawStaff(svg, options) {
  const {
    track, rests, clef, staffTop, width, contentX, measureWidth,
    systemStart, systemEnd, beatsPerMeasure, systemMeasures, systemIndex,
    showTime, numerator, denominator, showNames, finalSystem, fingering, noteToneFor, noteAnnotationFor,
  } = options;

  for (let line = 0; line < 5; line++) {
    const y = staffTop + line * 10;
    svg.appendChild(svgEl('line', {
      x1:10, x2:width-10, y1:y, y2:y,
      stroke:'#514b56', 'stroke-width':0.9,
    }));
  }

  drawClef(svg, clef, staffTop, showTime, numerator, denominator);

  for (let measure = 0; measure <= systemMeasures; measure++) {
    const x = contentX + measure * measureWidth;
    svg.appendChild(svgEl('line', {
      x1:x, x2:x, y1:staffTop, y2:staffTop+40,
      stroke:'#514b56', 'stroke-width':measure === 0 ? 1.1 : 1.25,
    }));
  }

  if (finalSystem) {
    const x = contentX + systemMeasures * measureWidth;
    svg.appendChild(svgEl('line', {
      x1:x-4, x2:x-4, y1:staffTop, y2:staffTop+40,
      stroke:'#24202a', 'stroke-width':1.2,
    }));
    svg.lastChild.previousSibling.setAttribute('stroke-width', '3');
  }

  const beatWidth = measureWidth / beatsPerMeasure;
  // 留出音符头、升号、指法框和当前指针的右侧安全区，避免最后一拍被 SVG 裁掉。
  const xForBeat = beat => Math.min(width - 32, contentX + (beat - systemStart + 0.31) * beatWidth);

  for (const rest of rests) {
    if (rest.start >= systemStart - 0.001 && rest.start < systemEnd - 0.001) {
      drawRest(svg, rest, xForBeat(rest.start), staffTop);
    }
  }
  const notesBefore = fingering
    ? track.notes.filter(n => n.start < systemStart - 0.001).length
    : 0;
  let noteIdx = notesBefore;
  let lastBoxX = null;
  let stackIndex = 0;
  for (const note of track.notes) {
    if (note.start >= systemStart - 0.001 && note.start < systemEnd - 0.001) {
      const fingerNum = fingering ? fingering[noteIdx] : (note.finger ?? null);
      const tone = noteToneFor ? noteToneFor(note) : 'default';
      const annotation = noteAnnotationFor ? noteAnnotationFor(note, track) : null;
      const x = xForBeat(note.start);
      // 相邻音符间距 < 18px（和弦或密集音型）时用 stackIndex 错位显示，防止框框重叠。
      // 使用模 4 循环：0→1→2→3→0→1…，密集音型最多占 4 个固定高度层，不会无限堆积溢出。
      stackIndex = (lastBoxX != null && Math.abs(x - lastBoxX) < 18) ? (stackIndex + 1) % 4 : 0;
      lastBoxX = x;
      drawNote(svg, note, x, clef, staffTop, showNames, fingerNum, tone, annotation, stackIndex, systemIndex);
      noteIdx++;
    }
  }
}

function buildStaffSvg(score, width, showNames, options = {}) {
  const lessonMode = options.lessonMode === true;
  const right = score.tracks.find(track => track.role === 'right') || score.tracks[0];
  const left = score.tracks.find(track => track.role === 'left');
  const hasBass = !!left;
  const beatsPerMeasure = score.numerator * (4 / score.denominator);
  const measureCount = Math.max(1, Math.ceil((score.totalBeats - 0.001) / beatsPerMeasure));
  const compactLandscape = window.innerWidth > window.innerHeight && window.innerHeight <= 600;
  const measuresPerSystem = compactLandscape
    ? (width >= 540 ? 3 : 2)
    : (width < 520 ? 1 : width < 900 ? 2 : 3);
  const systemCount = Math.ceil(measureCount / measuresPerSystem);
  const systemHeight = lessonMode
    ? (compactLandscape ? (hasBass ? 220 : 132) : (hasBass ? 250 : 150))
    : (compactLandscape ? (hasBass ? 198 : 110) : (hasBass ? 222 : 122));
  // lessonMode 下要给和弦/双音等同一时刻多个指法框（最多按 3 音堆叠）留出空间，避免顶部被裁切。
  const topPadding = lessonMode ? 48 : 8;
  const viewWidth = Math.max(300, width);
  const viewHeight = topPadding + systemCount * systemHeight;
  const contentX = 78;
  const rightContentPadding = 44;
  const noteRightEdge = viewWidth - 32;
  const svg = svgEl('svg', {
    viewBox:`0 0 ${viewWidth} ${viewHeight}`,
    role:'img',
    'aria-label':`${score.title} 五线谱`,
    class:'staff-score',
  });
  svg.appendChild(svgEl('title', {}, `${score.title} 五线谱`));

  const rightRests = buildRests(right, score.totalBeats, beatsPerMeasure);
  const leftRests = left ? buildRests(left, score.totalBeats, beatsPerMeasure) : [];

  for (let system = 0; system < systemCount; system++) {
    const startMeasure = system * measuresPerSystem;
    const systemMeasures = Math.min(measuresPerSystem, measureCount - startMeasure);
    const systemStart = startMeasure * beatsPerMeasure;
    const systemEnd = (startMeasure + systemMeasures) * beatsPerMeasure;
    const systemTop = topPadding + system * systemHeight;
    const trebleTop = systemTop + 18;
    const bassTop = trebleTop + (compactLandscape ? 92 : 104);
    const measureWidth = (viewWidth - contentX - rightContentPadding) / systemMeasures;

    if (!lessonMode) {
      for (let measure = 0; measure < systemMeasures; measure++) {
        svg.appendChild(svgEl('text', {
          x:contentX + measure * measureWidth + 5,
          y:trebleTop - 6,
          'font-size':9,
          'font-family':'Arial, sans-serif',
          fill:'#988fa1',
        }, String(startMeasure + measure + 1)));
      }
    }

    if (hasBass) {
      svg.appendChild(svgEl('line', {
        x1:10, x2:10, y1:trebleTop, y2:bassTop+40,
        stroke:'#24202a', 'stroke-width':2,
      }));
      svg.appendChild(svgEl('path', {
        d:`M 14 ${trebleTop} Q 3 ${trebleTop+28} 14 ${trebleTop+52} Q 3 ${bassTop+12} 14 ${bassTop+40}`,
        fill:'none', stroke:'#6c3fc5', 'stroke-width':1.5,
      }));
    }

    const common = {
      width:viewWidth,
      contentX,
      measureWidth,
      systemStart,
      systemEnd,
      beatsPerMeasure,
      systemMeasures,
      systemIndex:system,
      showTime:system === 0,
      numerator:score.numerator,
      denominator:score.denominator,
      showNames,
      finalSystem:system === systemCount - 1,
      noteToneFor:options.noteToneFor,
      noteAnnotationFor:options.noteAnnotationFor,
    };

    const currentNote = Number.isInteger(options.currentEventIndex)
      ? [right, left].filter(Boolean).flatMap(track => track.notes)
        .find(note => note.eventIndex === options.currentEventIndex && note.start >= systemStart - 0.001 && note.start < systemEnd - 0.001)
      : null;
    const pointerX = currentNote
      ? Math.min(noteRightEdge, contentX + (currentNote.start - systemStart + 0.31) * (measureWidth / beatsPerMeasure))
      : null;
    if (pointerX != null) {
      svg.appendChild(svgEl('rect', {
        x:pointerX - 10, y:trebleTop - 3, width:20,
        height:(left ? bassTop + 43 : trebleTop + 43) - (trebleTop - 3),
        fill:'#6c3fc5', opacity:'0.10',
      }));
    }

    drawStaff(svg, {
      ...common, track:right, rests:rightRests, clef:'treble', staffTop:trebleTop,
    });
    if (left) {
      drawStaff(svg, {
        ...common, track:left, rests:leftRests, clef:'bass', staffTop:bassTop,
      });
    }
    if (pointerX != null) {
      const px = pointerX - 22;  // 左移，与手指框并排而非堆叠
      svg.appendChild(svgEl('text', {
        x:px, y:trebleTop-26, 'text-anchor':'middle', 'font-size':9,
        'font-family':'Arial, sans-serif', 'font-weight':'800', fill:'#6c3fc5',
      }, '现在'));
      svg.appendChild(svgEl('path', {
        d:`M ${px-6} ${trebleTop-22} L ${px+6} ${trebleTop-22} L ${px} ${trebleTop-13} Z`,
        fill:'#6c3fc5',
      }));
    }
  }

  return svg;
}

function renderActiveScore() {
  const mount = document.getElementById('scoreMount');
  if (!mount || !state.activeSong?.midi) return;

  if (scoreState.status === 'loading') {
    mount.innerHTML = '<div class="score-status">正在从 MIDI 生成五线谱…</div>';
    return;
  }
  if (scoreState.status === 'error') {
    mount.innerHTML = `<div class="score-status">五线谱读取失败<br>${scoreState.error}</div>`;
    return;
  }

  const score = scoreState.library[state.activeSong.midi];
  if (!score) {
    mount.innerHTML = '<div class="score-status">没有找到这首曲目的 MIDI 五线谱数据</div>';
    return;
  }

  const width = Math.max(300, Math.floor(mount.getBoundingClientRect().width));
  mount.replaceChildren(buildStaffSvg(score, width, state.showNoteNames));
  const facts = document.getElementById('scoreFacts');
  if (facts) {
    const hands = score.tracks.some(track => track.role === 'left') ? '双手大谱表' : '右手高音谱表';
    facts.textContent = `${score.numerator}/${score.denominator} 拍 · ♩=${score.bpm} · ${hands} · ${Math.ceil(score.totalBeats / (score.numerator * (4 / score.denominator)))} 小节`;
  }
}

function practiceNoteTone(note, p) {
  if (!Number.isInteger(note.eventIndex)) return 'inactive';
  const localIndex = p?.sheet?.eventIndexToLocal?.get(note.eventIndex);
  if (!Number.isInteger(localIndex)) return 'inactive';
  const currentIndex = p.session?.getEventIndex() ?? 0;
  if (localIndex < currentIndex) {
    return p.result?.mistakeEventIndexes?.includes(localIndex) ? 'mistake' : 'done';
  }
  if (!p.finished && localIndex === currentIndex) return 'current';
  return 'target';
}

function practiceLetterName(midi) {
  const octave = Math.floor(midi / 12) - 1;
  return `${PITCH_NAMES[((midi % 12) + 12) % 12]}${octave}`;
}

// 先计算可靠的目标指法，再按当前标注模式决定显示多少信息。
// 非本关音符始终保持纯净的灰色谱面，避免长曲目被辅助文字铺满。
function practiceScoreAnnotation(note, track, p) {
  const letter = practiceLetterName(note.midi);
  const hand = track.role === 'left' ? 'left' : 'right';
  const mode = state.scoreAnnotationMode || 'all';
  const localIndex = p?.sheet?.eventIndexToLocal?.get(note.eventIndex);
  const currentIndex = p?.session?.getEventIndex?.() ?? -1;
  const isTarget = Number.isInteger(localIndex);

  let fingerNumber = note.finger ?? null;
  if (isTarget) {
    const eventNote = p.events?.[localIndex]?.notes?.find(candidate => candidate.hand === hand && candidate.note === note.midi);
    if (eventNote?.finger != null) {
      fingerNumber = eventNote.finger;
    }
  }

  if (!isTarget) return null;

  if (mode === 'names') return { letter, showFinger:false };
  if (mode === 'fingering') return { finger:fingerNumber, showLetter:false };
  if (mode === 'all') return { letter, finger:fingerNumber };

  // 简洁模式只给当前事件完整提示，下一组目标保留音名作为阅读线索。
  const distance = Number.isInteger(currentIndex) ? localIndex - currentIndex : 0;
  if (distance === 0) return { letter, finger:fingerNumber };
  if (distance === 1) return { letter, showFinger:false };
  return null;
}

function renderPracticeScore(p) {
  const mount = document.getElementById('practiceScoreMount');
  if (!mount || !p?.sheet?.score) return;
  const width = Math.max(300, Math.floor(mount.getBoundingClientRect().width));
  const currentEventIndex = p.finished
    ? null
    : p.sheet.targetEventIndexes?.[p.session?.getEventIndex() ?? -1];
  mount.replaceChildren(buildStaffSvg(p.sheet.score, width, false, {
    lessonMode:true,
    currentEventIndex,
    noteToneFor:note => practiceNoteTone(note, p),
    noteAnnotationFor:(note, track) => practiceScoreAnnotation(note, track, p),
  }));

  const currentAnchor = mount.querySelector('.practice-current-anchor');
  const currentSystem = currentAnchor ? Number(currentAnchor.dataset.practiceSystem) : null;
  if (!currentAnchor || !Number.isInteger(currentSystem)) return;
  p.lastScoreSystem = currentSystem;
  // 每次都校验可见性，但只有越出安全区才真正改写 scrollTop。
  // 这样既能在换行时跟谱，也能在用户滚动或控件聚焦后把当前音带回视口。
  scrollPracticeSystemIntoView(currentAnchor);
}

function scrollPracticeSystemIntoView(anchor) {
  if (!anchor) return;
  const content = anchor.closest('.content');
  if (!content) return;
  const anchorRect = anchor.getBoundingClientRect();
  const contentRect = content.getBoundingClientRect();
  const topSafeZone = contentRect.top + 72;
  const bottomSafeZone = contentRect.bottom - 92;
  if (anchorRect.top >= topSafeZone && anchorRect.bottom <= bottomSafeZone) return;
  const targetScrollTop = content.scrollTop + (anchorRect.top - contentRect.top) - contentRect.height * 0.36;
  const maxScrollTop = Math.max(0, content.scrollHeight - content.clientHeight);
  // 评分页会在每个音符后重建 DOM，平滑滚动尚未结束就会被下一次重绘打断，
  // 于是第三个系统开始出现“光标在下面、页面却停在上面”。换行时一次定位，
  // 同一行内完全不动，才能和练习输入保持同步。
  content.scrollTop = Math.min(maxScrollTop, Math.max(0, targetScrollTop));
}

function renderScoreModeControls() {

}

async function loadStaffScores() {
  try {
    const response = await fetch('/api/scores', { cache:'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    scoreState.library = await response.json();
    scoreState.status = 'ready';
  } catch (error) {
    scoreState.status = 'error';
    scoreState.error = error.message || '未知错误';
  }
  if (state.view === 'detail') renderActiveScore();
}

function profDot(songId) {
  const p = state.proficiency[songId] ?? 0;
  return `<div class="prof-dot ${PROF[p].dot}"></div>`;
}

    if (!group.length) continue;
    html += `<div class="section-lbl">${LEVEL_META[lv].name}</div>`;

function renderTasks() {
  const done = (id) => !!state.doneTasks[id];
  let html = `<div class="week-header">本周练习计划</div>`;
  for (const day of WEEK_TASKS) {
    const total = day.tasks.length;
    const completed = day.tasks.filter(t => done(t.id)).length;
    const allDone = completed === total;
    const isOpen = !!state.openDays[day.day];

    let numCls = day.isRest ? 'rest-day' : (allDone ? 'done-day' : '');
    html += `
      <div class="day-card">
        <div class="day-header" onclick="toggleDay(${day.day})">
          <div class="day-num ${numCls}">${allDone ? '✓' : day.day}</div>
          <div class="day-info">

            <div class="day-sub">${completed}/${total} 完成</div>

              <div class="task-text${done(t.id)?' done':''}">${t.text}</div>

      </div>`;
  }
  return html;
}

          <span>从左向右读谱，小节号标在每行上方</span>
          <span>实心带符干 = 四分/八分音符</span>
          <span>空心音符 = 二分音符</span>
        </div>
      </div>
      ${song.midi ? `<div class="midi-source"><strong>练习文件</strong> practice_midis/${song.midi}</div>` : ''}`;
  }

  return `<div class="sf-wrap">
    <div class="sf-hdr">
      <span class="sf-hdr-back" onclick="goBack()">‹</span>
      <span class="sf-hdr-title">${song.title}</span>
      <span class="sf-hdr-sub" onclick="toggleLandscapeProf()" title="横屏时点击修改熟练度">${meta.name} · ${PROF[p].label}⌄</span>
    </div>
    <div class="sf-prof">${profBtns}</div>
    <div class="sf-body">${sheetBody}</div>
  </div>`;
}

//  MAIN RENDER
// ═══════════════════════════════════════

function render() {
  const root = document.getElementById('root');
  const { view, activeSong } = state;

  // root.innerHTML 会整体销毁重建 .content/.sf-body，导致其 scrollTop 被重置为 0。
  // 练习评分页每弹一个音就调用一次 render()，若不保留滚动位置，画面会在弹奏
  // 过程中不断被强制拉回顶部。这里只在"同一个视图内容"重新渲染时才恢复滚动位置——
  // 真正切换到别的视图/曲目/关卡时，滚动位置理应重置为顶部。
  const renderKey = view === 'detail' ? `detail:${activeSong?.id ?? ''}`
    : view === 'practice-session' ? `practice:${state.practice?.courseId ?? ''}/${state.practice?.lessonId ?? ''}`
    : view;
  const prevScroller = root.querySelector('.content') || root.querySelector('.sf-body');
  const prevScrollTop = (prevScroller && root.dataset.renderKey === renderKey) ? prevScroller.scrollTop : 0;
  root.dataset.renderKey = renderKey;

  // 曲目详情：全屏横版
  if (view === 'detail' && activeSong) {
    root.innerHTML = renderDetailFullscreen(activeSong);
    const nextScroller = root.querySelector('.sf-body');
    if (nextScroller) nextScroller.scrollTop = prevScrollTop;
    requestAnimationFrame(renderActiveScore);
    return;
  }

  let hdrTitle = '课程';
  let body = '';

  if (view === 'songs') {
    hdrTitle = '曲目库';
    body = renderSongs();
  } else if (view === 'tasks') {
    hdrTitle = '本周计划';
    body = renderTasks();
  } else if (view === 'courses') {
    hdrTitle = '课程';
    body = renderCourses();
  } else if (view === 'drills') {
    hdrTitle = '专项训练';
    body = renderDrills();
  } else if (view === 'import') {
    hdrTitle = '导入新曲目';
    body = renderImport();
  } else if (view === 'course-detail') {
    hdrTitle = state.activeCourse ? state.activeCourse.title : '课程';
    body = renderCourseDetail();
  } else if (view === 'practice-session') {
    hdrTitle = state.practice?.lesson ? state.practice.lesson.title : '评分练习';
    body = renderPracticeSession();
  }

  const showBack = view==='import'||view==='course-detail'||view==='practice-session';
  const backFn = view==='practice-session' ? 'exitPracticeSession' : 'backToCourses';
  root.innerHTML = `
    <div class="hdr">
      <div class="hdr-shell">
        ${showBack ? `<div class="hdr-back" onclick="${backFn}()">‹</div>` : ''}
        <div class="hdr-title">${hdrTitle}</div>
      </div>
    </div>
    <div class="content"><main class="content-inner">${body}</main></div>
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
    <div class="tab-bar">
      <div class="tab${(view==='courses'||view==='import'||view==='course-detail'||view==='practice-session')?' active':''}" onclick="setView('courses')">
        <span class="icon" aria-hidden="true">♬</span>课程
      </div>
      <div class="tab${view==='drills'?' active':''}" onclick="setView('drills')">
        <span class="icon" aria-hidden="true">⌘</span>专项
      </div>
      <div class="tab${view==='songs'?' active':''}" onclick="setView('songs')">
        <span class="icon" aria-hidden="true">♫</span>曲目库
      </div>
      <div class="tab${view==='tasks'?' active':''}" onclick="setView('tasks')">
        <span class="icon" aria-hidden="true">□</span>计划
      </div>
    </div>`;
  const nextScroller = root.querySelector('.content');
  // root.innerHTML 重建了滚动容器，先同步恢复用户刚才的位置；
  // 随即同步重建谱面，避免 requestAnimationFrame 在连续输入或后台限流时留下空谱面。
  if (nextScroller) nextScroller.scrollTop = prevScrollTop;
  if (view === 'practice-session') {
    // 光标与当前事件在同一轮渲染内更新；只有真实换行时才重新定位。
    renderPracticeScore(state.practice);
  }
}

function setView(v) {
  if (state.view === 'practice-session' && v !== 'practice-session') {
    clearPracticeCountdown(state.practice);
    disconnectPracticeMidi();
    state.practice = null;
    const timer = state.practiceTimer;
    if (timer.active && timer.startTime && timer.lastActivity) {
      const toCredit = Math.max(0, Math.floor((timer.lastActivity - timer.startTime) / 1000));
      endPracticeTimerSession(toCredit);
    }
  }
  state.view = v;
  state.activeSong = null;
  render();
  if (v === 'courses' && !state.coursesLoaded) loadCourses();
}

function backToCourses() {
  state.view = 'courses';
  state.activeCourseId = null;
  state.activeCourse = null;
  state.import = null;
  render();
}

function openSong(id) {
  state.activeSong = SONGS.find(s => s.id === id);
  state.view = 'detail';
  render();
}

function goBack() {
  state.view = 'songs';
  state.activeSong = null;
  render();
}

function setProf(id, level) {
  state.proficiency[id] = level;
  saveProf();
  render();
}

function toggleNoteNames() {
  state.showNoteNames = !state.showNoteNames;
  localStorage.setItem('piano_note_names', state.showNoteNames ? '1' : '0');
  const button = document.querySelector('.note-toggle');
  if (button) button.textContent = state.showNoteNames ? '隐藏音名' : '显示音名';
  renderActiveScore();
}

function setScoreAnnotationMode(mode) {
  if (!SCORE_ANNOTATION_MODES.some(item => item.id === mode)) return;
  state.scoreAnnotationMode = mode;
  localStorage.setItem(SCORE_ANNOTATION_STORAGE_KEY, mode);
  if (state.view === 'practice-session') render();
  else renderActiveScore();
}

function toggleLandscapeProf() {
  document.querySelector('.sf-prof')?.classList.toggle('landscape-open');
}

function toggleTask(id) {
  state.doneTasks[id] = !state.doneTasks[id];
  saveTasks();
  render();
}

function toggleDay(day) {
  state.openDays[day] = !state.openDays[day];
  render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

let toastTimer = null;
function showToast(msg) {
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = ''; render(); }, 3200);
}

async function apiGet(path) {
  const res = await fetch(path);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`);
  return data;
}
async function apiPost(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`);
  return data;
}

async function loadCourses() {
  state.coursesLoaded = true;
  try {
    const [courseResult, settingsResult, timeResult] = await Promise.allSettled([
      apiGet('/api/courses?user=' + encodeURIComponent(state.currentUser)),
      apiGet('/api/settings'),
      apiGet('/api/practice-time'),
    ]);
    if (courseResult.status !== 'fulfilled') throw courseResult.reason;
    state.courses = courseResult.value.courses;
    if (settingsResult.status === 'fulfilled') state.settings = settingsResult.value || {};
    if (timeResult.status === 'fulfilled') {
      for (const user of PRACTICE_USERS) {
        state.practiceTimeStats[user] = timeResult.value.users?.[user] || 0;
      }
    }
  } catch (e) {
    showToast('加载课程失败：' + e.message);
  }
  render();
}

const HAND_LABEL = { left: '左手', right: '右手', both: '双手' };
const STAGE_LABEL = { A: '阶段 A · 单手熟悉', B: '阶段 B · 双手合练', C: '阶段 C · 扩大范围', manual: '自定义关卡' };

function courseProgress(course) {
  if (!course.lessons.length) return 0;
  return Math.round((course.lessons.filter(l => l.completed).length / course.lessons.length) * 100);
}

function getRecommendedPractice() {
  const settings = state.settings || {};
  const lastCourse = state.courses.find(course => course.course_id === settings.lastCourseId);
  const defaultCourse = state.courses.find(course => course.course_id === 'twinkle_both');
  const candidates = [lastCourse, defaultCourse, ...state.courses].filter((course, index, all) =>
    course && all.indexOf(course) === index,
  );

  for (const course of candidates) {
    const storedLesson = course.course_id === settings.lastCourseId
      ? course.lessons.find(lesson => lesson.lesson_id === settings.lastLessonId && lesson.unlocked && !lesson.completed)
      : null;
    const lesson = storedLesson || course.lessons.find(item => item.unlocked && !item.completed);
    if (lesson) return { course, lesson, isResume: Boolean(storedLesson) };
  }
  return null;
}

function courseCard(c) {
  const progress = courseProgress(c);
  const isDrill = c.category === 'drill';
  const isFingering = c.drill_group === 'fingering';
  const variant = isDrill ? (isFingering ? 'drill-fingering' : 'drill-technique') : 'song';
  const mark = isDrill ? (isFingering ? '指' : '基') : '曲';
  const kind = isDrill ? (isFingering ? '指法专项' : '基本功') : '曲目闯关';
  return `
    <article class="course-card course-card--${variant}" role="button" tabindex="0"
      onclick="openCourse('${c.course_id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCourse('${c.course_id}')}">
      <div class="course-card-top">
        <div class="course-card-mark" aria-hidden="true">${mark}</div>
        <div class="course-card-main">
          <div class="course-card-title">${escapeHtml(c.title)}</div>
          <div class="course-card-sub">${kind} · ${c.bpm} BPM · ${c.measure_count} 小节</div>
        </div>
        <div class="course-card-arrow" aria-hidden="true">›</div>
      </div>
      <div class="course-card-foot">
        <div class="course-progress-track"><div class="course-progress-fill" style="width:${progress}%"></div></div>
        <span class="course-card-status">${progress}%</span>
        <span class="course-card-progress">${c.lessons.filter(l=>l.completed).length}/${c.lessons.length} 关</span>
      </div>
    </article>
  `;
}

function renderPtimeBarChart() {
  const liveSeconds = state.practiceTimer.active && state.practiceTimer.startTime
    ? Math.floor((Date.now() - state.practiceTimer.startTime) / 1000) : 0;
  const totals = PRACTICE_USERS.map(u => {
    const base = state.practiceTimeStats[u] || 0;
    return u === state.currentUser ? base + liveSeconds : base;
  });
  const maxVal = Math.max(...totals, 1);
  const rows = PRACTICE_USERS.map((u, i) => {
    const pct = Math.round((totals[i] / maxVal) * 100);
    const isActive = u === state.currentUser;
    const liveTag = isActive && liveSeconds > 0
      ? `<span class="ptime-live-dot">●</span>`
      : '';
    return `
      <div class="ptime-bar-row" onclick="switchPracticeUser('${escapeHtml(u)}')">
        <div class="ptime-bar-label${isActive ? ' ptime-bar-label--active' : ''}">
          ${escapeHtml(u)}${liveTag}
        </div>
        <div class="ptime-bar-track">
          <div class="ptime-bar-fill ptime-bar-fill--${i}" style="width:${pct}%"></div>
        </div>
        <div class="ptime-bar-value ptime-bar-value--${i}">${formatPracticeTime(totals[i])}</div>
      </div>`;
  }).join('');
  return `<div class="ptime-widget">${rows}</div>`;
}

function renderCourses() {
  if (!state.coursesLoaded) return `<div class="empty-hint">加载中…</div>`;
  const recommended = getRecommendedPractice();
  const songs = state.courses.filter(c => c.category !== 'drill');
  const fingeringDrills = state.courses.filter(c => c.category === 'drill' && c.drill_group === 'fingering');
  const techniqueDrills = state.courses.filter(c => c.category === 'drill' && c.drill_group === 'technique');
  const songCards = songs.map(courseCard).join('');
  return `
    <div class="course-home">
      <div class="course-home-top">
        ${recommended ? `
          <section class="course-resume">
            <div class="course-resume-kicker">${recommended.isResume ? '继续练习' : '下一步建议'}</div>
            <div class="course-resume-title">${escapeHtml(recommended.course.title)} · ${escapeHtml(recommended.lesson.title)}</div>
            <div class="course-resume-meta">${HAND_LABEL[recommended.lesson.hand_mode] || recommended.lesson.hand_mode} · ${Math.round(recommended.lesson.speed * 100)}% 速度 · 等待模式</div>
            <div class="course-resume-actions">
              <button class="btn btn-primary" onclick="openPracticeSession('${recommended.course.course_id}','${recommended.lesson.lesson_id}')">开始评分练习</button>
              <button class="btn btn-secondary" onclick="openCourse('${recommended.course.course_id}')">查看课程</button>
            </div>
          </section>
        ` : `<section class="course-resume"><div class="course-resume-kicker">课程已完成</div><div class="course-resume-title">选择一首曲子继续练习</div></section>`}
        ${renderPtimeBarChart()}
      </div>
      <section class="course-section">
        <div class="course-section-head">
          <div>
            <div class="course-section-eyebrow">曲目闯关</div>
            <div class="course-section-title">从熟悉的旋律开始</div>
          </div>
          <div class="course-section-meta">${songs.length} 首曲目 · 按自己的节奏推进</div>
        </div>
        <div class="course-grid">${songCards || '<div class="empty-hint">还没有可练的曲目课程。</div>'}</div>
      </section>
      <section class="training-portal" role="button" tabindex="0" onclick="setView('drills')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setView('drills')}">
        <div class="training-portal-mark" aria-hidden="true">⌘</div>
        <div>
          <div class="training-portal-title">专项训练库</div>
          <div class="training-portal-copy">${fingeringDrills.length} 项指法动作 · ${techniqueDrills.length} 项基本功 · 每项都有独立关卡和指法</div>
        </div>
        <div class="training-portal-action">进入专项训练 ›</div>
      </section>
      <div class="add-course-btn" onclick="startImport()">
        <span>＋</span><span>添加自己的 MIDI（可选）</span>
      </div>
    </div>
  `;
}

      <div class="drill-filter" role="tablist" aria-label="筛选专项训练">
